<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System — Interactive 3D</title>

<style>
/* ================================================================
   SOLAR SYSTEM — visual chrome
   ================================================================ */
:root{
  --bg:#02030a;
  --panel:rgba(9,13,25,.78);
  --line:rgba(120,165,230,.16);
  --text:#e8eef8;
  --muted:#8fa2bd;
  --accent:#5ad1ff;
  --accent2:#7cf7c8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}

/* --- 3D canvas ------------------------------------------------- */
#scene{position:fixed;inset:0}
#scene canvas{display:block;cursor:grab;touch-action:none}
#scene canvas:active{cursor:grabbing}
#scene canvas.pick{cursor:pointer}

/* --- cinematic vignette --------------------------------------- */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}

/* --- projected body labels ------------------------------------ */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.label{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
  transform:translate(-50%,-50%);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:#c6d6ec;white-space:nowrap;padding:4px 7px;border-radius:6px;
  background:rgba(6,10,20,.35);border:1px solid rgba(120,165,230,.12);
  text-shadow:0 1px 6px rgba(0,0,0,.9);
  transition:color .2s,background .2s,border-color .2s,opacity .2s;
  user-select:none;opacity:.85}
.label:hover{color:#fff;background:rgba(10,20,38,.7);border-color:rgba(90,209,255,.45)}
.label.active{color:#fff;background:rgba(12,32,52,.8);border-color:rgba(90,209,255,.75);
  box-shadow:0 0 16px rgba(90,209,255,.25);opacity:1}
.label.moon{font-size:9px;padding:2px 5px;opacity:.6}

/* --- brand ----------------------------------------------------- */
.topbar{position:fixed;top:18px;left:20px;z-index:10;display:flex;gap:12px;
  align-items:center;pointer-events:none}
.brand-mark{width:34px;height:34px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 35% 35%,#ffe6a8,#ff9d2e 55%,#c4531a);
  box-shadow:0 0 22px rgba(255,160,50,.55),inset -6px -6px 12px rgba(120,30,0,.55)}
.brand-mark::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(255,190,90,.28)}
.brand h1{margin:0;font-size:15px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.brand p{margin:2px 0 0;font-size:10.5px;letter-spacing:.08em;color:var(--muted)}

/* --- quick-nav chips ------------------------------------------- */
.nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(56vw,780px)}
.chip{font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:#a9bbd4;background:rgba(9,14,26,.66);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
  transition:.18s}
.chip:hover{color:#fff;border-color:rgba(90,209,255,.5);background:rgba(14,26,46,.85)}
.chip.active{color:#04121c;background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 14px rgba(90,209,255,.4)}

/* --- info panel ------------------------------------------------ */
.panel{position:fixed;top:76px;right:20px;width:296px;z-index:10;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(16px);padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);
  max-height:calc(100vh - 220px);overflow:auto}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(120,165,230,.25);border-radius:6px}
.kicker{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);font-weight:700}
.panel h2{margin:6px 0 2px;font-size:21px;letter-spacing:.02em}
.panel .sub{margin:0 0 12px;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.stat{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);
  border-radius:9px;padding:7px 8px}
.stat dt{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#7f92ad;
  margin-bottom:3px}
.stat dd{margin:0;font-size:12px;font-weight:600;color:#eaf1fb}
.panel .desc{margin:0;font-size:12px;line-height:1.55;color:#b9c7db}

/* --- bottom dock ------------------------------------------------ */
.dock{position:fixed;left:20px;bottom:20px;z-index:10;display:flex;flex-direction:column;
  gap:9px;max-width:calc(100vw - 40px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(16px);padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;color:#c4d3e8;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);padding:7px 12px;border-radius:9px;
  cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{background:rgba(90,209,255,.14);border-color:rgba(90,209,255,.45);color:#fff}
.btn.on{background:rgba(90,209,255,.16);border-color:rgba(90,209,255,.5);color:#bdeeff}
.btn.primary{background:linear-gradient(180deg,#63d9ff,#37b7ea);color:#03131d;
  border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.chip:focus-visible,input[type=range]:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px}
.speed{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;
  border-radius:4px;background:rgba(255,255,255,.14);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#eaf7ff;border:2px solid var(--accent);
  box-shadow:0 0 10px rgba(90,209,255,.6);cursor:grab}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
  background:#eaf7ff;border:2px solid var(--accent);cursor:grab}
#speed-val{min-width:46px;font-variant-numeric:tabular-nums;color:var(--accent2);
  font-weight:600}

/* --- hint ------------------------------------------------------- */
.hint{position:fixed;bottom:24px;right:20px;left:auto;transform:none;z-index:8;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f83a0;
  background:rgba(6,10,20,.5);border:1px solid rgba(120,165,230,.1);
  padding:7px 14px;border-radius:999px;backdrop-filter:blur(10px);white-space:nowrap}

/* --- boot loader ------------------------------------------------ */
#loading{position:fixed;inset:0;z-index:50;background:#02030a;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(90,209,255,.18);border-top-color:var(--accent);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-status{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fa2bd}
#load-status.error{color:#ff8f8f;letter-spacing:.04em;text-transform:none;font-size:12px;
  max-width:80vw;text-align:center;line-height:1.5}

/* --- responsive ------------------------------------------------- */
@media (max-width:1000px){
  .hint{display:none}
}
@media (max-width:900px){
  .nav{top:64px;left:12px;right:12px;transform:none;max-width:none;
    justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .nav::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .panel{top:auto;bottom:152px;left:12px;right:12px;width:auto;max-height:36vh;
    padding:13px}
  .panel h2{font-size:17px}
  .dock{left:12px;right:12px;bottom:12px;max-width:none}
  input[type=range]{width:110px}
}
@media (max-width:520px){
  .topbar{top:12px;left:12px}
  .brand p{display:none}
}
</style>

<!-- three.js is pinned to a fixed version and served from a CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="vignette"></div>

<header class="topbar">
  <div class="brand-mark" aria-hidden="true"></div>
  <div class="brand">
    <h1>Solar System</h1>
    <p>interactive 3D · textures generated in the browser</p>
  </div>
</header>

<nav class="nav" id="nav" aria-label="Celestial bodies"></nav>

<aside class="panel" id="panel" aria-live="polite">
  <div class="kicker" id="p-kicker">Overview</div>
  <h2 id="p-name">The Solar System</h2>
  <p class="sub" id="p-sub">8 planets · 1 star · 1 moon</p>
  <dl class="stats" id="p-stats"></dl>
  <p class="desc" id="p-desc"></p>
</aside>

<div class="dock">
  <div class="card row">
    <button class="btn" id="btn-pause" type="button" aria-pressed="false">Pause</button>
    <div class="speed">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0" max="5" step="0.1" value="1"
             aria-label="Simulation speed">
      <span id="speed-val">1.0×</span>
    </div>
  </div>
  <div class="card row">
    <button class="btn on" type="button" data-toggle="orbits" aria-pressed="true">Orbits</button>
    <button class="btn on" type="button" data-toggle="labels" aria-pressed="true">Labels</button>
    <button class="btn on" type="button" data-toggle="rings" aria-pressed="true">Rings</button>
    <button class="btn on" type="button" data-toggle="belts" aria-pressed="true">Belts</button>
    <button class="btn primary" type="button" id="btn-overview">Overview</button>
  </div>
</div>

<div class="hint">Drag to orbit · Scroll to zoom · Click a body to focus · Esc = overview</div>

<div id="loading">
  <div class="spinner" aria-hidden="true"></div>
  <div id="load-status">Initialising…</div>
</div>

<!-- Watchdog: if the CDN module never arrives, explain instead of spinning forever. -->
<script>
  setTimeout(function () {
    var s = document.getElementById('load-status');
    if (s && !s.dataset.done && s.textContent.indexOf('Initialising') === 0) {
      s.textContent = 'Still loading three.js… check your network connection — the library is fetched from a CDN.';
      s.classList.add('error');
    }
  }, 12000);
</script>

<script type="module">
/* ================================================================
 *  SOLAR SYSTEM — a single-file three.js visualisation.
 *  Every texture is painted procedurally at runtime: no image files,
 *  no build step, no network requests other than the three.js module.
 * ================================================================ */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- *
 *  1.  CONSTANTS & TINY HELPERS
 * ---------------------------------------------------------------- */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const DAYS_PER_SECOND = 18;      // simulated days per second at 1× speed
const ORBIT_COMPRESSION = 0.6;   // <1 softens Kepler spacing so outer planets drift visibly
const LAND_THRESHOLD = 0.55;     // noise level separating ocean from land on Earth

const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;

/** Hermite smoothstep that also tolerates reversed edges. */
function smoothstep(a, b, x) {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
}
function mixRGB(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));

/** Deterministic PRNG so every reload paints the same world. */
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0x5e1f2026);

const $ = (selector) => document.querySelector(selector);

/* ---------------------------------------------------------------- *
 *  2.  SEAMLESS 3D VALUE NOISE / FBM
 *      Textures are sampled with a unit-sphere direction rather
 *      than flat coordinates, so equirectangular maps wrap cleanly
 *      at the date line with no visible seam.
 * ---------------------------------------------------------------- */

function hash3(ix, iy, iz) {
  let n = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(iz, 2147483647);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);

  const c000 = hash3(xi, yi, zi),         c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi),     c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1),     c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);

  const x00 = lerp(c000, c100, u), x10 = lerp(c010, c110, u);
  const x01 = lerp(c001, c101, u), x11 = lerp(c011, c111, u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}

function fbm3(x, y, z, octaves = 5) {
  let amplitude = 1, frequency = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amplitude * noise3(x * frequency, y * frequency, z * frequency);
    norm += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }
  return sum / norm;
}

/** Unit-sphere direction for an equirectangular texel (u, v). */
function sphereDir(u, v) {
  const lon = u * TAU;
  const lat = (0.5 - v) * Math.PI;
  const c = Math.cos(lat);
  return [c * Math.cos(lon), Math.sin(lat), c * Math.sin(lon)];
}

/** Sample a colour ramp: stops = [[position, [r, g, b]], …] 0…1. */
function rampRGB(t, stops) {
  if (t <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const pa = stops[i - 1][0], ca = stops[i - 1][1];
      const pb = stops[i][0],     cb = stops[i][1];
      return mixRGB(ca, cb, (t - pa) / (pb - pa));
    }
  }
  return stops[stops.length - 1][1];
}

/* ---------------------------------------------------------------- *
 *  3.  PROCEDURAL TEXTURE FACTORIES
 * ---------------------------------------------------------------- */

let MAX_ANISO = 1;   // set from renderer.capabilities during boot

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function canvasTexture(canvas, { srgb = true, wrapS = THREE.RepeatWrapping } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = wrapS;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.anisotropy = MAX_ANISO;
  t.needsUpdate = true;
  return t;
}

/* ---------- Earth ------------------------------------------------ */

/** Continent height field: domain-warped fbm evaluated on the sphere. */
function earthHeight(u, v) {
  const d = sphereDir(u, v);
  const w1 = noise3(d[0] * 1.6 + 11.3, d[1] * 1.6 + 5.1, d[2] * 1.6 + 7.7) - 0.5;
  const w2 = noise3(d[0] * 1.6 + 3.9,  d[1] * 1.6 + 9.4, d[2] * 1.6 + 2.2) - 0.5;
  const value = fbm3(
    (d[0] + w1 * 0.55) * 2.05,
    (d[1] + w2 * 0.55) * 2.05,
    (d[2] + (w1 - w2) * 0.55) * 2.05,
    5
  );
  return { value, land: value > LAND_THRESHOLD, dir: d };
}

function buildEarthDayTexture() {
  const W = 1024, H = 512;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const latPole = Math.abs(v - 0.5) * 2;          // 0 equator → 1 pole
    for (let x = 0; x < W; x++) {
      const h = earthHeight(x / W, v);
      const d = h.dir;
      const moist = noise3(d[0] * 7 + 21.7, d[1] * 7 + 13.1, d[2] * 7 + 17.9);
      const grit  = noise3(d[0] * 20 + 4.3, d[1] * 20 + 8.8, d[2] * 20 + 2.2);
      const jitter = (grit - 0.5) * 0.02;
      let c;

      if (h.land) {
        const above   = h.value - LAND_THRESHOLD;
        const dryness = 1 - moist;
        const heat    = 1 - smoothstep(0.3, 0.75, latPole);

        // vegetation base
        let landC = mixRGB([0.15, 0.33, 0.12], [0.09, 0.25, 0.10], moist);
        // hot + dry → desert
        const desert = clamp01((heat - 0.55) * 2.2) * clamp01((dryness - 0.45) * 2.4);
        landC = mixRGB(landC, [0.76, 0.62, 0.37], desert * 0.9);
        // thin sandy coastline
        const beach = 1 - smoothstep(0, 0.03, above);
        landC = mixRGB([0.80, 0.73, 0.52], landC, beach);
        // highlands → rock → snow-capped peaks
        const rock = smoothstep(0.60, 0.74, h.value + jitter);
        landC = mixRGB(landC, [0.50, 0.46, 0.42], rock * 0.8);
        const snow = smoothstep(0.69, 0.76, h.value + jitter);
        landC = mixRGB(landC, [0.97, 0.98, 1.0], snow);
        // polar tundra
        const tundra = smoothstep(0.5, 0.9, latPole);
        landC = mixRGB(landC, [0.58, 0.63, 0.56], tundra * 0.5);
        c = landC;
      } else {
        const depth = clamp01((LAND_THRESHOLD - h.value) / 0.38);
        c = mixRGB([0.08, 0.40, 0.66], [0.012, 0.06, 0.22], Math.pow(depth, 0.55));
      }

      // sea ice and ice caps over everything near the poles
      const cap = smoothstep(0.9, 0.965, latPole + (grit - 0.5) * 0.055);
      c = mixRGB(c, [0.96, 0.975, 0.995], cap);

      const i = (y * W + x) * 4;
      px[i] = c[0] * 255; px[i + 1] = c[1] * 255; px[i + 2] = c[2] * 255; px[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/** Warm emissive map: settlement clusters, coast bias, capital blooms. */
function buildEarthNightTexture() {
  const W = 512, H = 256;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const latPole = Math.abs(v - 0.5) * 2;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      px[i] = px[i + 1] = px[i + 2] = 0;
      px[i + 3] = 255;

      const h = earthHeight(x / W, v);
      if (!h.land) continue;

      const cluster   = noise3(h.dir[0] * 9 + 31.1, h.dir[1] * 9 + 17.7, h.dir[2] * 9 + 23.3);
      const lowland   = smoothstep(0, 0.10, h.value - LAND_THRESHOLD); // people crowd the coasts
      const temperate = 1 - smoothstep(0.62, 0.9, latPole);
      const light = smoothstep(0.54, 0.86, cluster) * lowland * temperate;
      if (light > 0.02) {
        px[i]     = 255 * light;
        px[i + 1] = 205 * light;
        px[i + 2] = 115 * light;
      }
    }
  }
  ctx.putImageData(img, 0, 0);

  // brighter blooms for major urban areas
  ctx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < 130; n++) {
    const u = rng(), v = 0.15 + rng() * 0.7;
    const h = earthHeight(u, v);
    if (!h.land) continue;
    const r = 1.5 + rng() * 4;
    const cy = v * H;
    const paint = (cx) => {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, 'rgba(255,240,200,0.9)');
      g.addColorStop(0.5, 'rgba(255,190,90,0.35)');
      g.addColorStop(1, 'rgba(255,150,50,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fill();
    };
    paint(u * W);
    if (u * W < r) paint(u * W + W);            // wrap blooms across the date line
    if (u * W > W - r) paint(u * W - W);
  }
  ctx.globalCompositeOperation = 'source-over';
  return cv;
}

/** Soft white cloud shell with fbm coverage. */
function buildCloudTexture() {
  const W = 512, H = 256;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    for (let x = 0; x < W; x++) {
      const d = sphereDir(x / W, v);
      const w = (noise3(d[0] * 2.4 + 3.7, d[1] * 2.4 + 6.1, d[2] * 2.4 + 8.3) - 0.5) * 0.45;
      const c = fbm3((d[0] + w) * 3.1, (d[1] + w) * 3.1, (d[2] + w) * 3.1, 5);
      const a = smoothstep(0.47, 0.66, c);
      const shade = 0.85 + 0.15 * smoothstep(0.47, 0.8, c);
      const i = (y * W + x) * 4;
      px[i] = 255 * shade; px[i + 1] = 255 * shade; px[i + 2] = 255 * shade;
      px[i + 3] = 255 * a;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ---------- generic rocky worlds (Mercury, Moon, Mars) ---------- */

function drawCraters(ctx, W, H, count, strength, sizeMax) {
  for (let n = 0; n < count; n++) {
    const cx = rng() * W, cy = rng() * H;
    const r = 2 + Math.pow(rng(), 3) * sizeMax;
    const shade = 0.4 + rng() * 0.6;
    const paint = (ox) => {
      const g = ctx.createRadialGradient(cx + ox - r * 0.2, cy - r * 0.2, r * 0.05,
                                         cx + ox, cy, r);
      g.addColorStop(0,    `rgba(20,18,16,${(0.55 * strength).toFixed(3)})`);
      g.addColorStop(0.6,  `rgba(40,36,32,${(0.40 * strength).toFixed(3)})`);
      g.addColorStop(0.78, `rgba(255,252,240,${(0.42 * strength * shade).toFixed(3)})`);
      g.addColorStop(0.9,  `rgba(255,255,250,${(0.14 * strength * shade).toFixed(3)})`);
      g.addColorStop(1,    'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx + ox, cy, r, 0, TAU);
      ctx.fill();
    };
    paint(0);
    if (cx < r) paint(W);                 // wrap craters across the seam
    if (cx > W - r) paint(-W);
  }
}

function buildRockyTexture({
  W = 512, H = 256, low, high,
  freq = 4, octaves = 4, patchiness = 0.4, contrast = 1.5,
  craters = 0, craterStrength = 0.5, craterSize = 24,
  polarCaps = false, capLat = 0.9,
  extra = null,
}) {
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const latPole = Math.abs(v - 0.5) * 2;
    for (let x = 0; x < W; x++) {
      const d = sphereDir(x / W, v);
      const grain = fbm3(d[0] * freq, d[1] * freq, d[2] * freq, octaves);
      const patch = fbm3(d[0] * 1.5 + 6.1, d[1] * 1.5 + 2.7, d[2] * 1.5 + 9.3, 3);
      let m = clamp01(grain * (1 - patchiness) + patch * patchiness);
      m = clamp01(0.5 + (m - 0.5) * contrast);
      let c = mixRGB(low, high, m);

      if (polarCaps) {
        const cap = smoothstep(capLat, capLat + 0.07, latPole + (grain - 0.5) * 0.05);
        c = mixRGB(c, [0.96, 0.97, 0.99], cap);
      }

      const i = (y * W + x) * 4;
      px[i] = c[0] * 255; px[i + 1] = c[1] * 255; px[i + 2] = c[2] * 255; px[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  if (craters > 0) drawCraters(ctx, W, H, craters, craterStrength, craterSize);
  if (extra) extra(ctx, W, H);
  return cv;
}

/* ---------- soft elliptical features (spots, streaks) ----------- */

/** Paint a blurred ellipse; rx/ry are fractions of W/H. */
function drawSoftSpot(ctx, W, H, u, v, rx, ry, stops, rotation = 0) {
  const cx = u * W, cy = v * H;
  const r = rx * W;
  const paint = (ox) => {
    ctx.save();
    ctx.translate(cx + ox, cy);
    ctx.rotate(rotation);
    ctx.scale(1, (ry * H) / r);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.6);
    for (const stop of stops) g.addColorStop(stop[0], stop[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  };
  paint(0);
  if (cx < r * 1.7) paint(W);
  if (cx > W - r * 1.7) paint(-W);
}

/* ---------- generic banded giants ------------------------------ */

function buildBandedTexture({ W = 512, H = 256, bands = 12, warpAmt = 0.3, turb = 0.3,
                              palette, extra = null }) {
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const lat = (0.5 - v) * Math.PI;                     // −π/2 … +π/2
    for (let x = 0; x < W; x++) {
      const d = sphereDir(x / W, v);
      const w = (fbm3(d[0] * 2.6 + 1.7, d[1] * 2.6 + 4.2, d[2] * 2.6 + 8.9, 3) - 0.5) * warpAmt;
      const t = (fbm3(d[0] * 7.0 + 2.3, d[1] * 7.0 + 6.5, d[2] * 7.0 + 3.1, 3) - 0.5) * turb;
      const s = Math.sin((lat + w) * bands + Math.sin(lat * 3.0 + w * 2.0) * 0.8);
      const c = rampRGB(clamp01(s * 0.5 + 0.5 + t), palette);
      const i = (y * W + x) * 4;
      px[i] = c[0] * 255; px[i + 1] = c[1] * 255; px[i + 2] = c[2] * 255; px[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  if (extra) extra(ctx, W, H);
  return cv;
}

/* ---------- Venus ------------------------------------------------ */

function buildVenusTexture() {
  const W = 512, H = 256;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const lat = (0.5 - v) * Math.PI;
    for (let x = 0; x < W; x++) {
      // shear the noise with latitude → curved sulphuric cloud streaks
      const shift = Math.sin(lat * 5.0) * 0.06 + Math.sin(lat * 11.0 + 0.7) * 0.022;
      const d = sphereDir(x / W + shift, clamp01(v + Math.cos(lat * 4.0) * 0.012));
      const h = fbm3(d[0] * 5.5, d[1] * 5.5, d[2] * 5.5, 4);
      let c = rampRGB(h, [
        [0.0,  [0.60, 0.44, 0.19]],
        [0.35, [0.84, 0.68, 0.37]],
        [0.65, [0.95, 0.86, 0.64]],
        [1.0,  [1.00, 0.96, 0.83]],
      ]);
      const polar = smoothstep(0.72, 1.0, Math.abs(v - 0.5) * 2) * 0.3;
      c = mixRGB(c, [0.48, 0.36, 0.17], polar);
      const i = (y * W + x) * 4;
      px[i] = c[0] * 255; px[i + 1] = c[1] * 255; px[i + 2] = c[2] * 255; px[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ---------- the Sun ---------------------------------------------- */

function buildSunTexture() {
  const W = 512, H = 256;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = img.data;

  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    for (let x = 0; x < W; x++) {
      const d = sphereDir(x / W, v);
      const coarse = fbm3(d[0] * 9, d[1] * 9, d[2] * 9, 5);
      const fine   = fbm3(d[0] * 24 + 7.7, d[1] * 24 + 3.3, d[2] * 24 + 5.5, 3);
      const c = rampRGB(clamp01(coarse * 0.72 + fine * 0.28), [
        [0.0,  [0.86, 0.26, 0.02]],
        [0.40, [1.00, 0.55, 0.06]],
        [0.62, [1.00, 0.80, 0.28]],
        [0.80, [1.00, 0.94, 0.62]],
        [1.0,  [1.00, 0.99, 0.85]],
      ]);
      const i = (y * W + x) * 4;
      px[i] = c[0] * 255; px[i + 1] = c[1] * 255; px[i + 2] = c[2] * 255; px[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // a few cooler sunspot clusters
  for (let n = 0; n < 7; n++) {
    const cx = rng() * W, cy = H * 0.3 + rng() * H * 0.4, r = 3 + rng() * 9;
    const paint = (ox) => {
      const g = ctx.createRadialGradient(cx + ox, cy, 0, cx + ox, cy, r);
      g.addColorStop(0, 'rgba(80,26,4,0.75)');
      g.addColorStop(0.55, 'rgba(120,45,6,0.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx + ox, cy, r, 0, TAU);
      ctx.fill();
    };
    paint(0);
    if (cx < r) paint(W);
    if (cx > W - r) paint(-W);
  }
  return cv;
}

/* ---------- Saturn's rings --------------------------------------- */

function buildRingTexture() {
  const W = 512, H = 16;
  const cv = makeCanvas(W, H);
  const ctx = cv.getContext('2d');

  for (let x = 0; x < W; x++) {
    const t = x / (W - 1);                 // 0 = inner edge, 1 = outer edge
    const n = noise3(t * 46, 0.5, 0.5);

    // broad structure: faint C ring → bright B ring → Cassini → A ring
    let bright = 0.30;
    if (t > 0.10) bright = 0.95;
    if (t > 0.56) bright = 0.62;
    if (t > 0.88) bright = 0.50;
    bright += (n - 0.5) * 0.30 + 0.05 * Math.sin(t * 190);

    let alpha = 0.60 + 0.40 * Math.sin(t * 96 + n * 5.0);
    alpha *= 1 - 0.90 * Math.exp(-Math.pow((t - 0.575) / 0.016, 2));   // Cassini division
    alpha *= 1 - 0.85 * Math.exp(-Math.pow((t - 0.900) / 0.007, 2));   // Encke gap
    alpha *= smoothstep(0, 0.04, t) * smoothstep(1, 0.97, t);          // soft edges

    const b = clamp01(bright);
    const a = clamp01(alpha) * 0.97;
    ctx.fillStyle = `rgba(${Math.round(255 * b)},${Math.round(240 * b)},` +
                    `${Math.round(205 * b)},${a.toFixed(3)})`;
    ctx.fillRect(x, 0, 1, H);
  }
  return cv;
}

/* ---------- sky: radial glows, stars, galaxy, nebulae ----------- */

/** Neutral/warm radial sprite texture built from colour stops. */
function radialTexture(stops) {
  const cv = makeCanvas(256, 256);
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const stop of stops) g.addColorStop(stop[0], stop[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}

/** Small helper: build a THREE.Points cloud from plain arrays. */
function pointCloud(positions, colors, { size, opacity, attenuation = false }) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  if (colors) g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const m = new THREE.PointsMaterial({
    size,
    sizeAttenuation: attenuation,
    vertexColors: !!colors,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  return new THREE.Points(g, m);
}

function buildStarfield(count, dpr) {
  const pos = [], col = [];
  for (let i = 0; i < count; i++) {
    const z = rng() * 2 - 1;
    const a = rng() * TAU;
    const r = Math.sqrt(1 - z * z);
    const rad = 1450 + rng() * 450;
    pos.push(Math.cos(a) * r * rad, z * rad, Math.sin(a) * r * rad);

    const roll = rng();
    let c;
    if (roll < 0.10) c = [1.00, 0.78, 0.55];       // warm star
    else if (roll < 0.26) c = [0.72, 0.82, 1.00];   // hot blue star
    else { const b = 0.75 + rng() * 0.25; c = [b, b * 0.99, b * 0.97]; }
    const dim = 0.45 + rng() * 0.55;
    col.push(c[0] * dim, c[1] * dim, c[2] * dim);
  }
  // point sprites are sized in device pixels → scale by DPR for a constant CSS size
  return pointCloud(pos, col, { size: 1.6 * dpr, opacity: 0.95 });
}

function buildMilkyWay(count, dpr) {
  const pos = [], col = [];
  for (let i = 0; i < count; i++) {
    const a = rng() * TAU;
    const lat = (rng() + rng() + rng() - 1.5) * 0.20;   // pseudo-gaussian band
    const rad = 1500 + rng() * 300;
    const cl = Math.cos(lat);
    pos.push(Math.cos(a) * cl * rad, Math.sin(lat) * rad, Math.sin(a) * cl * rad);
    const b = 0.5 + rng() * 0.5;
    col.push(0.62 * b, 0.70 * b, 0.95 * b);
  }
  const pts = pointCloud(pos, col, { size: 1.1 * dpr, opacity: 0.30 });
  pts.rotation.set(0.45, 0, 0.95);                    // tilt the galactic plane
  return pts;
}

const NEBULA_TINTS = [0x5a3a8c, 0x2a4a8c, 0x8c3a5a, 0x2a6a6a, 0x4a3a7a, 0x6a4a2a, 0x3a5a8c];

function buildNebulae(hazeTexture) {
  const group = new THREE.Group();
  for (let i = 0; i < NEBULA_TINTS.length; i++) {
    const theta = rng() * TAU;
    const phi = Math.acos(rng() * 2 - 1);
    const rad = 950 + rng() * 400;
    const dir = [
      Math.sin(phi) * Math.cos(theta),
      Math.cos(phi),
      Math.sin(phi) * Math.sin(theta),
    ];
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: hazeTexture,
      color: NEBULA_TINTS[i],
      transparent: true,
      opacity: 0.06 + rng() * 0.05,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false,
    }));
    sprite.position.set(dir[0] * rad, dir[1] * rad, dir[2] * rad);
    sprite.scale.setScalar(500 + rng() * 500);
    group.add(sprite);
  }
  return group;
}

        'by gravity. Pick a body from the chips above, click it in the scene, or press ' +
        'Esc to return here.',
};

/* ---------------------------------------------------------------- *
 *  5.  MODULE STATE
 * ---------------------------------------------------------------- */

// three.js core objects
let renderer, scene, camera, controls;
let selRing;
let starMat = null, milkyMat = null;

// belts
let beltGroup, beltInstances, beltPoints, beltData, beltDustPositions, kuiper;
const dummy = new THREE.Object3D();

// interaction state
const state = {
  speed: 1,
  paused: false,
  orbits: true,
  labels: true,
  rings: true,
  belts: true,
};
const bodies = {};        // id → body record
const bodyList = [];      // animation order
const pickables = [];     // meshes that respond to clicks
const orbitLines = [];    // orbit rings (Orbits toggle)
const ringMeshes = [];    // planetary rings (Rings toggle)
const labelList = [];     // body records carrying a DOM label
let focus = null;         // body the camera is following
let tween = null;         // active camera flight

const followPos = new THREE.Vector3();
const tmpA = new THREE.Vector3();
const tmpB = new THREE.Vector3();
const tmpC = new THREE.Vector3();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const clock = new THREE.Clock();
let elapsed = 0;
let dpr = 1;

/* ---------------------------------------------------------------- *
 *  6.  WORLD CONSTRUCTION
 * ---------------------------------------------------------------- */

/**
 * Node layout per body — two deliberately separate chains:
 *
 *   POSITION (child of `parent`):
 *     orbit   – rotation.y = orbital angle, rotation.x = inclination
 *       holder– offset by orbital radius; label + focus target
 *
 *   ORIENTATION (child of the scene, re-synced every frame):
 *     tiltGroup – fixed axial tilt (rotation.z)
 *       spin    – rotation.y = spin (animated)
 *         mesh
 *
 * Keeping the tilt outside the orbit pivot means the pole stays fixed
 * in space instead of precessing once per orbit, and def.spinRate is
 * the literal world-space spin rate. tiltGroup.position is copied from
 * the holder at the start of every frame.
 */
function makeBody(id, def, parent = scene) {
  const orbit = new THREE.Group();
  orbit.rotation.x = (def.incl || 0) * DEG;
  parent.add(orbit);

  const holder = new THREE.Group();
  holder.position.x = def.distance;
  orbit.add(holder);

  const tiltGroup = new THREE.Group();
  tiltGroup.rotation.z = (def.tilt || 0) * DEG;
  scene.add(tiltGroup);

  const spinGroup = new THREE.Group();
  tiltGroup.add(spinGroup);

  // Angular speed of the (compressed) orbit, rad/s at 1× speed.
  // motionDays lets non-planetary orbits (the Moon) pick their own pace.
  const motionPeriod = def.motionDays ||
    (def.au ? 365.25 * Math.pow(def.au, ORBIT_COMPRESSION) : 0);
  const orbitOmega = motionPeriod
    ? (TAU / motionPeriod) * DAYS_PER_SECOND
    : 0;

  const body = {
    id, def, orbit, holder, tiltGroup, spinGroup,
    angle: rng() * TAU,
    orbitOmega,
    mesh: null,
    clouds: null,
    labelEl: null,
    selectRadius: def.selectRadius ?? def.radius,
  };

  // DOM label (positioned by projecting holder + labelY each frame)
  const el = document.createElement('div');
  el.className = 'label' + (def.isMoon ? ' moon' : '');
  el.textContent = def.name;

  let press = null;
  el.addEventListener('pointerdown', (e) => { press = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) return;
    focusOn(body);
  });

  $('#labels').appendChild(el);
  body.labelEl = el;
  labelList.push(body);

  bodies[id] = body;
  bodyList.push(body);
  return body;
}

function attachMesh(body, geometry, material) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.userData.body = body;
  body.spinGroup.add(mesh);
  body.mesh = mesh;
  pickables.push(mesh);
  return mesh;
}

/** Circular orbit guide. inclination is applied about the X axis. */
function addOrbitLine(radius, inclDeg, color, opacity = 0.26, parent = scene) {
  const pts = [];
  for (let i = 0; i < 200; i++) {
    const a = (i / 200) * TAU;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const mat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity, depthWrite: false,
  });
  const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat);
  line.rotation.x = (inclDeg || 0) * DEG;
  parent.add(line);
  orbitLines.push(line);
  return line;
}

/**
 * Atmospheric limb glow.
 * The back-face depth value is remapped so brightness peaks exactly at
 * the planet's silhouette and falls smoothly to zero at the glow
 * sphere's own edge — no hard rim artefact.
 */
function makeAtmosphere(glowRadius, planetRadius, color, strength, power = 2.0) {
  const edge = Math.sqrt(Math.max(0.001, 1 - Math.pow(planetRadius / glowRadius, 2)));
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor:    { value: new THREE.Color(color) },
      uEdge:     { value: edge },
      uPower:    { value: power },
      uStrength: { value: strength },
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3  uColor;
      uniform float uEdge;
      uniform float uPower;
      uniform float uStrength;
      varying vec3  vNormal;
      void main() {
        float d = -dot(normalize(vNormal), vec3(0.0, 0.0, 1.0));
        float i = pow(clamp(d / uEdge, 0.0, 1.0), uPower) * uStrength;
        gl_FragColor = vec4(uColor, i);
      }`,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  return new THREE.Mesh(new THREE.SphereGeometry(glowRadius, 48, 24), mat);
}

/** RingGeometry with radial UVs (default UVs are planar). */
function makeRingGeometry(inner, outer, thetaSegments = 160, phiSegments = 6) {
  const geo = new THREE.RingGeometry(inner, outer, thetaSegments, phiSegments);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const r = Math.hypot(pos.getX(i), pos.getY(i));
    uv.setXY(i, (r - inner) / (outer - inner), 0.5);
  }
  uv.needsUpdate = true;
  return geo;
}

function addRings(body, def, ringTexture) {
  const inner = def.radius * def.ringInner;
  const outer = def.radius * def.ringOuter;
  const mat = new THREE.MeshBasicMaterial({
    map: ringTexture,
    color: def.ringColor ?? 0xffffff,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: def.ringOpacity ?? 0.95,
    depthWrite: false,          // rings must not hide the planet behind them
  });
  const mesh = new THREE.Mesh(makeRingGeometry(inner, outer), mat);
  mesh.rotation.x = -Math.PI / 2;   // XY ring → equatorial XZ plane
  mesh.userData.body = body;
  body.tiltGroup.add(mesh);
  ringMeshes.push(mesh);
  pickables.push(mesh);             // clicking the rings focuses the planet
}

function buildSun(T) {
  const body = makeBody('sun', DEFS.sun);
  attachMesh(
    body,
    new THREE.SphereGeometry(DEFS.sun.radius, 64, 32),
    new THREE.MeshBasicMaterial({ map: T.sun, toneMapped: false })
  );

  // Two additive corona sprites. The opaque disc occludes their cores,
  // so only the halo around the limb survives the depth test.
  const inner = new THREE.Sprite(new THREE.SpriteMaterial({
    map: T.coronaTight, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  }));
  inner.scale.setScalar(DEFS.sun.radius * 6.5);

  const outer = new THREE.Sprite(new THREE.SpriteMaterial({
    map: T.coronaWide, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  }));
  outer.scale.setScalar(DEFS.sun.radius * 15);

  body.holder.add(inner, outer);
}

function addEarthExtras(body, T) {
  // cloud shell: slightly larger than the surface, lit by the same Sun
  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(body.def.radius * 1.05, 64, 32),
    new THREE.MeshStandardMaterial({
      map: T.clouds,
      transparent: true,
      opacity: 0.92,
      depthWrite: false,
      roughness: 1,
      metalness: 0,
    })
  );
  clouds.renderOrder = 1;
  body.tiltGroup.add(clouds);
  body.clouds = clouds;

  const glow = makeAtmosphere(body.def.radius * 1.13, body.def.radius, 0x6fb6ff, 1.0, 2.0);
  glow.renderOrder = 2;
  body.holder.add(glow);
}

function buildPlanets(T) {
  const order = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

  for (const id of order) {
    const def = DEFS[id];
    const body = makeBody(id, def);

    const material = new THREE.MeshStandardMaterial({
      map: T[id],
      roughness: 0.92,
      metalness: 0,
    });
    if (id === 'earth') {
      material.emissive = new THREE.Color(0xffffff);
      material.emissiveMap = T.night;
      material.emissiveIntensity = 0.9;   // city lights on the dark hemisphere
    }

    attachMesh(body, new THREE.SphereGeometry(def.radius, def.segments, def.segments / 2), material);
    addOrbitLine(def.distance, def.incl, def.orbitColor);

    if (id === 'earth') {
      addEarthExtras(body, T);
    } else if (id === 'venus') {
      const glow = makeAtmosphere(def.radius * 1.20, def.radius, 0xffd7a0, 0.65, 2.2);
      glow.renderOrder = 2;
      body.holder.add(glow);
    }
    if (def.ringInner) addRings(body, def, T.rings);
  }

  // The Moon hangs off Earth's holder so it travels with the planet.
  const mdef = DEFS.moon;
  const moon = makeBody('moon', mdef, bodies.earth.holder);
  attachMesh(
    moon,
    new THREE.SphereGeometry(mdef.radius, mdef.segments, mdef.segments / 2),
    new THREE.MeshStandardMaterial({ map: T.moon, roughness: 0.95, metalness: 0 })
  );
  // The orbit pivot supplies the rotation, which is exactly what keeps
  // one face pointing at Earth (tidal locking, locked: true).
  addOrbitLine(mdef.distance, mdef.incl, 0x8fa6c8, 0.18, bodies.earth.holder);
}

function buildBelts() {
  beltGroup = new THREE.Group();
  scene.add(beltGroup);

  const N = 900;
  beltData = [];
  const dust = new Float32Array(N * 3);

  for (let i = 0; i < N; i++) {
    const r = 68 + rng() * 13;                     // between Mars and Jupiter
    beltData.push({
      r,
      a: rng() * TAU,
      y: (rng() + rng() - 1) * 2.4,
      omega: 68 / Math.pow(r, 1.5),                // Kepler-ish: inner rocks move faster
      s: 0.08 + Math.pow(rng(), 2) * 0.24,
      q: new THREE.Quaternion().setFromEuler(
        new THREE.Euler(rng() * TAU, rng() * TAU, rng() * TAU)
      ),
    });
  }

  beltInstances = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.MeshStandardMaterial({ color: 0x9c9081, roughness: 1, metalness: 0 }),
    N
  );
  beltInstances.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  beltInstances.frustumCulled = false;              // instances move every frame
  beltGroup.add(beltInstances);

  // Point haze shares the rock positions; only shown when zoomed out.
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dust, 3));
  beltPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    size: 1.8, sizeAttenuation: false,
    color: 0xd8c9a6, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  beltPoints.frustumCulled = false;
  beltGroup.add(beltPoints);
  beltDustPositions = dust;

  // Kuiper belt beyond Neptune
  kuiper = new THREE.Group();
  beltGroup.add(kuiper);
  const kp = [], kc = [];
  for (let i = 0; i < 1500; i++) {
    const r = 192 + rng() * 24;
    const a = rng() * TAU;
    kp.push(Math.cos(a) * r, (rng() + rng() - 1) * 5, Math.sin(a) * r);
    const b = 0.5 + rng() * 0.5;
    kc.push(0.55 * b, 0.72 * b, 0.95 * b);
  }
  const kg = new THREE.BufferGeometry();
  kg.setAttribute('position', new THREE.Float32BufferAttribute(kp, 3));
  kg.setAttribute('color', new THREE.Float32BufferAttribute(kc, 3));
  kuiper.add(new THREE.Points(kg, new THREE.PointsMaterial({
    size: 1.5, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false,
  })));
}

function buildSelectionRing() {
  selRing = new THREE.Mesh(
    new THREE.RingGeometry(1, 1.06, 96),
    new THREE.MeshBasicMaterial({
      color: 0x5ad1ff, transparent: true, opacity: 0.7,
      side: THREE.DoubleSide, depthWrite: false,
      blending: THREE.AdditiveBlending,
    })
  );
  selRing.visible = false;
  selRing.renderOrder = 5;
  scene.add(selRing);
}

/** Assemble sky, Sun, planets, Moon, belts and the focus marker. */
function buildWorld(T) {
  const stars = buildStarfield(4200, dpr);
  starMat = stars.material;
  scene.add(stars);

  const milkyWay = buildMilkyWay(4500, dpr);
  milkyMat = milkyWay.material;
  scene.add(milkyWay);

  scene.add(buildNebulae(T.haze));

  buildSun(T);
  buildPlanets(T);
  buildBelts();
  buildSelectionRing();
}

/* ---------------------------------------------------------------- *
 *  7.  CAMERA FOCUS, LABELS & PICKING
 * ---------------------------------------------------------------- */

/** Standing position for the overview, widened for narrow viewports. */
function overviewPosition() {
  const aspect = Math.max(
    camera ? camera.aspect : window.innerWidth / Math.max(1, window.innerHeight),
    0.45
  );
  const dist = Math.max(300, 195 / (Math.tan(25 * DEG) * aspect));
  const elev = 26 * DEG;
  return new THREE.Vector3(0, Math.sin(elev) * dist, Math.cos(elev) * dist);
}

function focusOn(body) {
  focus = body;
  followPos.copy(body.holder.getWorldPosition(tmpA));

  // Keep the current viewing direction so the flight feels like a push-in.
  const dir = tmpB.subVectors(camera.position, controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0.2, 0.4, 1);
  dir.normalize();

  const dist = Math.max(2.5, body.def.radius * 4.5, body.selectRadius * 3.2);
  tween = {
    t: 0,
    dur: 1.15,
    fromPos: camera.position.clone(),
    fromTarget: controls.target.clone(),
    dir: dir.clone(),
    dist,
    body,
  };

  controls.minDistance = Math.max(0.5, body.def.radius * 1.9);
  controls.enabled = false;            // no orbiting mid-flight
  selRing.visible = true;

  renderBodyInfo(body.def);
  syncActive();
}

function overview() {
  focus = null;
  tween = {
    t: 0,
    dur: 1.2,
    fromPos: camera.position.clone(),
    fromTarget: controls.target.clone(),
    toPos: overviewPosition(),
    toTarget: new THREE.Vector3(),
  };
  controls.minDistance = 10;
  controls.enabled = false;
  selRing.visible = false;

  renderOverviewInfo();
  syncActive();
}

/** Fly the camera (tween → follow) and keep the marker on the focus. */
function updateCamera(dt) {
  if (tween) {
    tween.t += dt;
    const a = Math.min(1, tween.t / tween.dur);
    // easeInOutCubic
    const e = a < 0.5 ? 4 * a * a * a : 1 - Math.pow(-2 * a + 2, 3) / 2;

    if (tween.body) {
      // Re-evaluate the target every frame: the body keeps orbiting.
      const p = tween.body.holder.getWorldPosition(tmpA);
      tmpB.copy(p).addScaledVector(tween.dir, tween.dist);
      camera.position.lerpVectors(tween.fromPos, tmpB, e);
      controls.target.lerpVectors(tween.fromTarget, p, e);
      followPos.copy(p);
    } else {
      camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
      controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
    }

    if (a >= 1) {
      tween = null;
      controls.enabled = true;
    }
  } else if (focus) {
    // Shift camera and target by the body's displacement: the user keeps
    // full freedom to orbit while the camera rides along with the planet.
    const p = focus.holder.getWorldPosition(tmpA);
    tmpB.subVectors(p, followPos);
    camera.position.add(tmpB);
    controls.target.add(tmpB);
    followPos.copy(p);
  }
}

/** Pulsing ring that brackets the focused body. */
function updateSelectionMarker() {
  if (!focus) return;
  focus.holder.getWorldPosition(selRing.position);
  selRing.quaternion.copy(camera.quaternion);
  selRing.scale.setScalar(focus.selectRadius);
  selRing.material.opacity = 0.5 + 0.28 * Math.sin(elapsed * 2.8);
}

/** Project every body label to screen space. */
function updateLabels() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (state.labels) camera.updateMatrixWorld();      // fresh inverse for projection

  for (const body of labelList) {
    const el = body.labelEl;
    if (!state.labels) { el.style.display = 'none'; continue; }

    body.holder.getWorldPosition(tmpC);
    tmpC.y += body.def.labelY;
    const dist = tmpC.distanceTo(camera.position);
    tmpC.project(camera);

    if (tmpC.z < -1 || tmpC.z > 1 ||
        tmpC.x < -1.2 || tmpC.x > 1.2 || tmpC.y < -1.2 || tmpC.y > 1.2) {
      el.style.display = 'none';
      continue;
    }

    el.style.display = '';
    const x = (tmpC.x * 0.5 + 0.5) * w;
    const y = (-tmpC.y * 0.5 + 0.5) * h;
    el.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    const base = body === focus ? 1 : clamp01(1.05 - dist / 900);
    el.style.opacity = String(base * (body.def.isMoon ? 0.65 : 1));
    el.classList.toggle('active', body === focus);
  }
}

/** Cast a ray through a CSS pixel; returns the topmost pickable mesh. */
function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}

function bindCanvasEvents() {
  const el = renderer.domElement;
  let down = null;

  el.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });

  el.addEventListener('pointerup', (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 6) return;                 // that was a drag, not a click
    const hit = pickAt(e.clientX, e.clientY);
    if (hit) focusOn(hit.userData.body);
  });

  // Hover cursor — skipped while dragging, and ray/box tests make this cheap.
  el.addEventListener('pointermove', (e) => {
    if (down) { el.classList.remove('pick'); return; }
    el.classList.toggle('pick', !!pickAt(e.clientX, e.clientY));
  });
}

/* ---------------------------------------------------------------- *
 *  8.  USER INTERFACE
 * ---------------------------------------------------------------- */

function renderInfo(info) {
  $('#p-kicker').textContent = info.kicker;
  $('#p-name').textContent = info.name;
  $('#p-sub').textContent = info.sub;

  const dl = $('#p-stats');
  dl.textContent = '';
  for (const [k, v] of info.stats) {
    const wrap = document.createElement('div');
    wrap.className = 'stat';
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = v;
    wrap.append(dt, dd);
    dl.appendChild(wrap);
  }
  $('#p-desc').textContent = info.desc;
}

function renderOverviewInfo() { renderInfo(OVERVIEW_INFO); }
function renderBodyInfo(def) {
  renderInfo({ kicker: def.tag, name: def.name, sub: def.sub, stats: def.stats, desc: def.desc });
}

function syncActive() {
  document.querySelectorAll('.chip').forEach((chip) => {
    chip.classList.toggle('active', !!focus && chip.dataset.id === focus.id);
  });
}

function buildNav() {
  const nav = $('#nav');
  for (const id of NAV_ORDER) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.dataset.id = id;
    chip.textContent = DEFS[id].name;
    chip.addEventListener('click', () => focusOn(bodies[id]));
    nav.appendChild(chip);
  }
}

function bindUI() {
  const pauseBtn = $('#btn-pause');
  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? 'Play' : 'Pause';
    pauseBtn.classList.toggle('on', state.paused);
    pauseBtn.setAttribute('aria-pressed', String(state.paused));
  });

  const speedInput = $('#speed');
  const applySpeed = () => {
    state.speed = Number(speedInput.value);
    $('#speed-val').textContent = state.speed.toFixed(1) + '×';
    const pct = (state.speed / Number(speedInput.max)) * 100;
    speedInput.style.background =
      `linear-gradient(90deg,#5ad1ff 0 ${pct}%,rgba(255,255,255,.14) ${pct}% 100%)`;
  };
  speedInput.addEventListener('input', applySpeed);
  applySpeed();

  document.querySelectorAll('[data-toggle]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.toggle;
      state[key] = !state[key];
      btn.classList.toggle('on', state[key]);
      btn.setAttribute('aria-pressed', String(state[key]));

      // Apply immediately; labels are re-evaluated every frame.
      orbitLines.forEach((line) => { line.visible = state.orbits; });
      ringMeshes.forEach((ring) => { ring.visible = state.rings; });
      beltGroup.visible = state.belts;
    });
  });

  $('#btn-overview').addEventListener('click', overview);

  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); pauseBtn.click(); }
    else if (e.code === 'Escape') overview();
    else if (e.key === 'o' || e.key === 'O') $('[data-toggle="orbits"]').click();
    else if (e.key === 'l' || e.key === 'L') $('[data-toggle="labels"]').click();
  });
}

/* ---------------------------------------------------------------- *
 *  9.  ANIMATION LOOP
 * ---------------------------------------------------------------- */

function updateBodies(dt, ts) {
  for (const body of bodyList) {
    const def = body.def;

    // 1. orbital motion
    if (body.orbitOmega) {
      body.angle += body.orbitOmega * ts * dt;
      body.orbit.rotation.y = body.angle;
    }

    // 2. snap the detached orientation group onto the body's position
    body.holder.getWorldPosition(body.tiltGroup.position);

    // 3. spin — a world-space rate, because the tilt group is detached.
    //    Tidally locked bodies (the Moon) spin exactly once per orbit.
    const spinRate = def.locked ? body.orbitOmega : (def.spinRate || 0);
    body.spinGroup.rotation.y += spinRate * ts * dt;

    if (body.clouds) {
      body.clouds.rotation.y += (def.cloudRate || 0) * ts * dt;
    }
  }
}

function updateBelts(dt, ts) {
  if (!beltGroup.visible) return;

  const dust = beltDustPositions;
  for (let i = 0; i < beltData.length; i++) {
    const rock = beltData[i];
    rock.a += rock.omega * ts * dt;
    const x = Math.cos(rock.a) * rock.r;
    const z = Math.sin(rock.a) * rock.r;

    dummy.position.set(x, rock.y, z);
    dummy.quaternion.copy(rock.q);
    dummy.scale.setScalar(rock.s);
    dummy.updateMatrix();
    beltInstances.setMatrixAt(i, dummy.matrix);

    dust[i * 3] = x; dust[i * 3 + 1] = rock.y; dust[i * 3 + 2] = z;
  }
  beltInstances.instanceMatrix.needsUpdate = true;
  beltPoints.geometry.attributes.position.needsUpdate = true;
  beltPoints.visible = camera.position.length() > 150;   // haze only at a distance
  kuiper.rotation.y += 0.02 * ts * dt;
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp after tab switches
  const ts = state.paused ? 0 : state.speed;
  elapsed += dt;

  updateBodies(dt, ts);
  updateBelts(dt, ts);
  updateCamera(dt);
  controls.update();                             // damping + internal sync
  updateSelectionMarker();
  updateLabels();

  renderer.render(scene, camera);
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  // Point sprites are measured in device pixels — keep CSS size constant.
  if (starMat) starMat.size = 1.6 * dpr;
  if (milkyMat) milkyMat.size = 1.1 * dpr;
}

/* ---------------------------------------------------------------- *
 *  10.  BOOT
 * ---------------------------------------------------------------- */

function setStatus(text) { $('#load-status').textContent = text + '…'; }

async function init() {
  /* --- renderer ------------------------------------------------ */
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  $('#scene').appendChild(renderer.domElement);
  MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  /* --- scene, camera, controls --------------------------------- */
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02030a);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 5000);
  camera.position.copy(overviewPosition());

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.minDistance = 10;
  controls.maxDistance = 1200;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.85;

  /* --- lighting ------------------------------------------------ */
  // decay = 0 disables inverse-square falloff, so outer planets stay as
  // brightly lit as the inner ones (distances here are heavily compressed).
  scene.add(new THREE.PointLight(0xfff3df, 3.4, 0, 0));
  // very dim cool fill so night sides are not pure black
  scene.add(new THREE.AmbientLight(0x334466, 0.6));

  /* --- procedural textures, painted in passes ------------------ */
  const T = {};

  setStatus('Painting the Sun');
  await nextFrame();
  T.sun = canvasTexture(buildSunTexture());
  T.coronaTight = radialTexture(CORONA_TIGHT);
  T.coronaWide = radialTexture(CORONA_WIDE);
  T.haze = radialTexture(HAZE);

  setStatus('Painting Mercury and Venus');
  await nextFrame();
  T.mercury = canvasTexture(buildRockyTexture({
    low: [0.28, 0.27, 0.25], high: [0.74, 0.72, 0.68],
    freq: 4.5, octaves: 5, patchiness: 0.4, contrast: 1.4,
    craters: 300, craterStrength: 0.55, craterSize: 30,
  }));
  T.venus = canvasTexture(buildVenusTexture());

  setStatus('Painting Earth');
  await nextFrame();
  T.night = canvasTexture(buildEarthNightTexture());
  T.clouds = canvasTexture(buildCloudTexture());
  T.earth = canvasTexture(buildEarthDayTexture());

  setStatus('Painting Mars and the giants');
  await nextFrame();
  T.mars = canvasTexture(buildRockyTexture({
    low: [0.40, 0.19, 0.11], high: [0.88, 0.57, 0.36],
    freq: 3.6, octaves: 5, patchiness: 0.5, contrast: 1.6,
    craters: 90, craterStrength: 0.22, craterSize: 16,
    polarCaps: true, capLat: 0.87,
  }));
  T.jupiter = canvasTexture(buildBandedTexture({
    bands: 15, warpAmt: 0.34, turb: 0.30,
    palette: [
      [0.00, [0.99, 0.96, 0.90]],
      [0.28, [0.84, 0.66, 0.46]],
      [0.50, [0.60, 0.37, 0.23]],
      [0.72, [0.92, 0.76, 0.55]],
      [1.00, [0.99, 0.97, 0.92]],
    ],
    extra: (ctx, W, H) => {
      // Great Red Spot
      drawSoftSpot(ctx, W, H, 0.30, 0.64, 0.05, 0.028, [
        [0.00, 'rgba(176, 84, 54,0.95)'],
        [0.40, 'rgba(198,118, 76,0.85)'],
        [0.68, 'rgba(222,166,118,0.45)'],
        [0.85, 'rgba(238,205,165,0.18)'],
        [1.00, 'rgba(0,0,0,0)'],
      ], -0.25);
      // smaller white ovals
      drawSoftSpot(ctx, W, H, 0.62, 0.55, 0.02, 0.012, [
        [0.00, 'rgba(255,252,240,0.50)'],
        [0.60, 'rgba(255,250,235,0.15)'],
        [1.00, 'rgba(0,0,0,0)'],
      ], 0);
    },
  }));
  T.saturn = canvasTexture(buildBandedTexture({
    bands: 12, warpAmt: 0.26, turb: 0.22,
    palette: [
      [0.00, [0.97, 0.93, 0.80]],
      [0.45, [0.84, 0.72, 0.49]],
      [1.00, [0.99, 0.96, 0.86]],
    ],
  }));
  T.uranus = canvasTexture(buildBandedTexture({
    bands: 9, warpAmt: 0.16, turb: 0.14,
    palette: [
      [0.00, [0.55, 0.80, 0.82]],
      [0.50, [0.66, 0.88, 0.90]],
      [1.00, [0.76, 0.93, 0.94]],
    ],
  }));
  T.neptune = canvasTexture(buildBandedTexture({
    bands: 10, warpAmt: 0.24, turb: 0.24,
    palette: [
      [0.00, [0.12, 0.23, 0.60]],
      [0.45, [0.21, 0.35, 0.79]],
      [0.75, [0.34, 0.49, 0.92]],
      [1.00, [0.55, 0.68, 0.98]],
    ],
    extra: (ctx, W, H) => {
      // Great Dark Spot
      drawSoftSpot(ctx, W, H, 0.62, 0.42, 0.045, 0.026, [
        [0.00, 'rgba(18, 30, 96,0.85)'],
        [0.50, 'rgba(24, 40,120,0.45)'],
        [1.00, 'rgba(0,0,0,0)'],
      ], -0.2);
      // bright methane cirrus streaks
      drawSoftSpot(ctx, W, H, 0.20, 0.52, 0.05, 0.007, [
        [0.00, 'rgba(235,244,255,0.45)'],
        [0.60, 'rgba(220,235,255,0.12)'],
        [1.00, 'rgba(0,0,0,0)'],
      ], 0.05);
    },
  }));
  T.rings = canvasTexture(buildRingTexture());

  setStatus('Painting the Moon');
  await nextFrame();
  T.moon = canvasTexture(buildRockyTexture({
    low: [0.19, 0.19, 0.20], high: [0.66, 0.65, 0.63],
    freq: 5.0, octaves: 5, patchiness: 0.55, contrast: 1.6,
    craters: 420, craterStrength: 0.6, craterSize: 26,
  }));

  setStatus('Scattering stars');
  await nextFrame();
  buildWorld(T);

  /* --- UI wiring ----------------------------------------------- */
  buildNav();
  renderOverviewInfo();
  bindUI();
  bindCanvasEvents();
  window.addEventListener('resize', onResize);

  /* --- go ------------------------------------------------------- */
  const loading = $('#loading');
  $('#load-status').dataset.done = '1';   // disarm the CDN watchdog above
  loading.classList.add('hidden');
  setTimeout(() => { loading.style.display = 'none'; }, 700);

  renderer.setAnimationLoop(animate);
}

// Surface any boot failure inside the loader instead of a blank page.
init().catch((err) => {
  const status = $('#load-status');
  status.textContent = 'Could not start: ' + (err && err.message ? err.message : err);
  status.classList.add('error');
});
</script>
