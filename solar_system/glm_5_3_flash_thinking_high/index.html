<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ==========================================================================
   SECTION 1 — Utilities: seeded RNG, integer hash, tileable value noise, fbm
   ========================================================================== */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(ix, iy, seed) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(seed, 0x9e3779b9);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// 2D value noise. x wraps with integer period px so equirect textures are seamless.
function vnoise(x, y, px, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const p = Math.max(1, px | 0);
  const x0 = ((ix % p) + p) % p, x1 = (x0 + 1) % p;
  const n00 = hash2(x0, iy, seed),     n10 = hash2(x1, iy, seed);
  const n01 = hash2(x0, iy + 1, seed), n11 = hash2(x1, iy + 1, seed);
  return (n00 + (n10 - n00) * sx) * (1 - sy) + (n01 + (n11 - n01) * sx) * sy;
}

function fbm(x, y, px, seed, octaves = 4) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {
    sum += amp * vnoise(x * freq, y * freq, px * freq, seed + o * 131);
    norm += amp; amp *= 0.5; freq *= 2;
  }
  return sum / norm;
}

/* --- colour / math helpers ---------------------------------------------- */

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
function smooth(a, b, t) { t = clamp01((t - a) / (b - a)); return t * t * (3 - 2 * t); }

/* ==========================================================================
   SECTION 2 — Procedural texture generators (canvas 2D, no external files)
   ========================================================================== */

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function toTexture(canvas, srgb = true) {
  const tex = new THREE.CanvasTexture(canvas);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* --- Earth: colour + bump + specular maps generated in one pass ---------- */
function generateEarthMaps() {
  const W = 1024, H = 512, P = 8, seed = 11;
  const mapC = makeCanvas(W, H), bumpC = makeCanvas(W, H), specC = makeCanvas(W, H);
  const mImg = mapC.getContext('2d').createImageData(W, H);
  const bImg = bumpC.getContext('2d').createImageData(W, H);
  const sImg = specC.getContext('2d').createImageData(W, H);
  const md = mImg.data, bd = bImg.data, sd = sImg.data;

  const deep    = hexToRgb('#0a2c55'), shallow = hexToRgb('#1d6f9e');
  const sand    = hexToRgb('#c9b87a'), grass   = hexToRgb('#4d7a35');
  const forest  = hexToRgb('#2e5c28'), rock    = hexToRgb('#7d6f5c');
  const snow    = hexToRgb('#eef2f5');

  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const lat = Math.abs(v - 0.5) * 2;               // 0 equator → 1 pole
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      // domain-warped fbm gives continent-like shapes
      const wx = fbm(u * P, v * P * 0.5, P, seed + 7, 3) - 0.5;
      let e = fbm(u * P + wx * 1.6, v * P * 0.5 + wx * 1.1, P, seed, 5);
      e += 0.10 * (fbm(u * P * 4, v * P * 2, P * 4, seed + 3, 3) - 0.5);

      const sea = 0.5;
      let c, bump, spec;
      if (e < sea) {
        c = mix3(deep, shallow, smooth(sea - 0.07, sea, e));
        c = mix3(c, sand, smooth(sea - 0.012, sea, e) * 0.55);
        bump = 0.35; spec = 205;
      } else {
        const hgt = (e - sea) / (1 - sea);
        const dry = fbm(u * P * 2, v * P, P * 2, seed + 21, 3);
        c = mix3(grass, forest, dry);
        c = mix3(c, rock, smooth(0.4, 0.9, hgt));
        c = mix3(c, snow, smooth(0.78, 0.95, hgt + lat * 0.3));
        bump = 0.35 + hgt * 0.65; spec = 14;
      }
      // polar sea-ice / snow cap
      c = mix3(c, snow, smooth(0.87, 0.97, lat + (e < sea ? 0.03 : 0)));

      const k = (y * W + x) * 4;
      md[k] = c[0]; md[k + 1] = c[1]; md[k + 2] = c[2]; md[k + 3] = 255;
      const bg = bump * 255; bd[k] = bd[k + 1] = bd[k + 2] = bg; bd[k + 3] = 255;
      const sg = spec;      sd[k] = sd[k + 1] = sd[k + 2] = sg; sd[k + 3] = 255;
    }
  }
  mapC.getContext('2d').putImageData(mImg, 0, 0);
  bumpC.getContext('2d').putImageData(bImg, 0, 0);
  specC.getContext('2d').putImageData(sImg, 0, 0);
  return { mapC, bumpC, specC };
}

/* --- Clouds: RGBA canvas, white wisps with alpha ------------------------- */
function generateClouds() {
  const W = 512, H = 256, P = 6, seed = 77;
  const canvas = makeCanvas(W, H);
  const img = canvas.getContext('2d').createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      const warp = fbm(u * P * 2, v * P * 2, P * 2, seed + 5, 3) - 0.5;
      const n = fbm(u * P + warp * 1.5, v * P * 1.2 + warp, P, seed, 4);
      const a = smooth(0.52, 0.74, n) * 235;
      const k = (y * W + x) * 4;
      d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = a;
    }
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
  return canvas;
}

/* --- Banded gas giants / Venus: palette bands + turbulence + optional spot */
function generateBands(opts) {
  const { W = 512, H = 256, P = 6, seed = 1, palette,
          wobble = 0.06, streak = 0.12, spot = null, spotColor = '#b04a32' } = opts;
  const cols = palette.map(hexToRgb);
  const spotC = spot ? hexToRgb(spotColor) : null;
  const canvas = makeCanvas(W, H);
  const img = canvas.getContext('2d').createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      const w1 = fbm(u * P, v * P * 0.5, P, seed + 9, 4) - 0.5;
      const t = clamp01(v + w1 * wobble);
      const n = t * (cols.length - 1);
      const i = Math.min(cols.length - 2, Math.floor(n));
      let c = mix3(cols[i], cols[i + 1], smooth(0.3, 0.7, n - i));
      // fine horizontal streaks
      const st = fbm(u * P * 2, v * P * 26, P * 2, seed + 4, 2) - 0.5;
      const m = 1 + st * streak;
      if (spot) {
        let dx = Math.abs(u - spot.x); dx = Math.min(dx, 1 - dx) / spot.rx;
        const dy = (v - spot.y) / spot.ry;
        const dd = Math.sqrt(dx * dx + dy * dy);
        if (dd < 1) c = mix3(c, spotC, smooth(1.0, 0.35, dd) * 0.85);
      }
      const k = (y * W + x) * 4;
      d[k] = Math.min(255, c[0] * m); d[k + 1] = Math.min(255, c[1] * m);
      d[k + 2] = Math.min(255, c[2] * m); d[k + 3] = 255;
    }
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
  return canvas;
}

/* --- Rocky worlds: fbm base + stamped craters (+ optional polar caps) ---- */
function generateRocky(opts) {
  const { W = 512, H = 256, P = 6, seed = 1, base1, base2,
          craters = 60, caps = 0, dark = false, darkLevel = 0.42 } = opts;
  const c1 = hexToRgb(base1), c2 = hexToRgb(base2), snow = hexToRgb('#e8e8ea');
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    const lat = Math.abs(v - 0.5) * 2;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      let e = fbm(u * P, v * P * 0.5, P, seed, 5);
      let c = mix3(c1, c2, e);
      if (dark) {
        const m = fbm(u * P, v * P * 0.5, P, seed + 31, 3);
        if (m < darkLevel) {
          const f = 1 - 0.4 * smooth(darkLevel, darkLevel - 0.08, m);
          c = [c[0] * f, c[1] * f, c[2] * f];
        }
      }
      if (caps > 0) c = mix3(c, snow, smooth(1 - caps, 1 - caps + 0.06, lat));
      const k = (y * W + x) * 4;
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // stamp craters on top with soft gradients
  const rand = mulberry32(seed * 7 + 1);
  for (let i = 0; i < craters; i++) {
    const cx = rand() * W, cy = H * 0.12 + rand() * H * 0.76;
    const r = 2 + rand() * rand() * 14;
    let g = ctx.createRadialGradient(cx, cy, r * 0.15, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,0.38)');
    g.addColorStop(0.75, 'rgba(0,0,0,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    // bright rim
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = Math.max(1, r * 0.16);
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2); ctx.stroke();
  }
  return canvas;
}

/* --- Sun: granulation ramp, used as an emissive colour map ---------------- */
function generateSun() {
  const W = 512, H = 256, P = 10, seed = 5;
  const a = hexToRgb('#c33d0f'), b = hexToRgb('#ff9a2a'), c = hexToRgb('#ffe9a8');
  const canvas = makeCanvas(W, H);
  const img = canvas.getContext('2d').createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      const n  = fbm(u * P, v * P * 0.5, P, seed, 5);
      const n2 = fbm(u * P * 3, v * P * 1.5, P * 3, seed + 9, 3);
      const t = clamp01(n * 0.7 + n2 * 0.5);
      let col = mix3(a, b, smooth(0.3, 0.62, t));
      col = mix3(col, c, smooth(0.62, 0.92, t));
      const k = (y * W + x) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
    }
  }
  canvas.getContext('2d').putImageData(img, 0, 0);
  return canvas;
}

/* --- Saturn rings: 1-D radial band profile (uv.x = radius) ---------------- */
function generateRings() {
  const W = 512, H = 16;
  const c1 = hexToRgb('#8f7a5a'), c2 = hexToRgb('#d9c8a8');
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let x = 0; x < W; x++) {
    const r = x / (W - 1);
    const n = fbm(r * 60, 0.5, 4096, 33, 4);
    let a = 0.8 * smooth(0, 0.06, r) * smooth(1, 0.92, r);
    a *= 0.5 + 0.5 * n;
    const div = smooth(0.02, 0.055, Math.abs(r - 0.66));   // Cassini division
    a *= 0.12 + 0.88 * div;
    const col = mix3(c1, c2, n);
    for (let y = 0; y < H; y++) {
      const k = (y * W + x) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/* --- Soft radial glow (sun corona sprite, star point sprite) -------------- */
function generateGlow(stops) {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  for (const [t, col] of stops) g.addColorStop(t, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return canvas;
}

/* ==========================================================================
   SECTION 3 — Body data (visual scale, not to true scale; facts are real)
   ========================================================================== */

const PLANET_DATA = [

      palette: ['#b98a5a', '#e6d2ae', '#a06a42', '#e8d9b8', '#8f5a3a', '#d9c49a', '#c29468', '#efe2c4'],

    gen: () => generateBands({ seed: 81, wobble: 0.05, streak: 0.06,
      palette: ['#2f5fbe', '#4a7fd4', '#2a55aa', '#5b8cd9', '#3568c2'],
      spot: { x: 0.3, y: 0.4, rx: 0.05, ry: 0.04 }, spotColor: '#1c3f8c' }),

const SUN_INFO = {
  name: 'Sun', type: 'G-type main-sequence star', diameter: '1,392,700 km',
  au: '—', day: '≈25 days (equator)',

/* ==========================================================================
   SECTION 4 — Renderer, scene, camera, controls, global state
   ========================================================================== */

let renderer, scene, camera, controls;
const solarGroup = new THREE.Group();
const earthGroup = new THREE.Group();

const state = {
  mode: 'solar',          // 'solar' | 'earth'
  follow: null,           // Object3D the camera tracks (or null)
  lastFollowPos: new THREE.Vector3(),
  timeScale: 1,
  paused: false,
  showOrbits: true,
  selected: null,
};

let flight = null;        // active camera flight
const planets = [];       // built entries: { data, holder, mesh, orbit, angle }
let pickables = [];       // meshes eligible for click-picking
let moonPivotSolar = null;
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
  camera.position.set(0, 95, 210);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 9;
  controls.maxDistance = 900;

  scene.add(solarGroup);
  scene.add(earthGroup);
  earthGroup.visible = false;

  buildStars();
  buildSolarSystem();
  buildEarthScene();
  buildUI();
  bindPointer();

  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', onKeyDown);

  document.getElementById('loading').classList.add('done');
  renderer.setAnimationLoop(animate);
}

/* ==========================================================================
   SECTION 5 — Starfield (Points with a soft round sprite)
   ========================================================================== */

function buildStars() {
  const N = 3500;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const rand = mulberry32(999);
  const cWhite = new THREE.Color(1, 1, 1);
  const cBlue  = new THREE.Color(0.72, 0.82, 1.0);
  const cWarm  = new THREE.Color(1.0, 0.88, 0.7);
  for (let i = 0; i < N; i++) {
    // uniform direction on a sphere shell
    const z = rand() * 2 - 1;
    const th = rand() * Math.PI * 2;
    const r = 700 + rand() * 700;
    const s = Math.sqrt(1 - z * z);
    pos[i * 3]     = r * s * Math.cos(th);
    pos[i * 3 + 1] = r * z;
    pos[i * 3 + 2] = r * s * Math.sin(th);
    const pick = rand();
    const base = pick < 0.75 ? cWhite : pick < 0.9 ? cBlue : cWarm;
    const b = 0.45 + rand() * 0.55;
    col[i * 3] = base.r * b; col[i * 3 + 1] = base.g * b; col[i * 3 + 2] = base.b * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const sprite = toTexture(generateGlow([
    [0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)'],
  ]), false);
  const mat = new THREE.PointsMaterial({
    size: 1.8, map: sprite, transparent: true, depthWrite: false,
    sizeAttenuation: false, vertexColors: true,
  });
  scene.add(new THREE.Points(geo, mat));
}

/* ==========================================================================
   SECTION 6 — Solar system build (sun, planets, orbits, rings, moon)
   ========================================================================== */

function buildSolarSystem() {
  // --- Sun ---------------------------------------------------------------
  const sunTex = toTexture(generateSun());
  const sunMat = new THREE.MeshBasicMaterial({ map: sunTex });
  sunMat.toneMapped = false;
  const sun = new THREE.Mesh(new THREE.SphereGeometry(6, 64, 32), sunMat);
  sun.userData.bodyIndex = -1; // -1 = the Sun
  solarGroup.add(sun);
  pickables.push(sun);

  const glowTex = toTexture(generateGlow([
    [0, 'rgba(255,244,214,0.9)'], [0.2, 'rgba(255,190,90,0.45)'],
    [0.5, 'rgba(255,140,40,0.14)'], [1, 'rgba(255,120,20,0)'],
  ]), false);
  const glowMat = new THREE.SpriteMaterial({
    map: glowTex, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true,
  });
  glowMat.toneMapped = false;
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(36);
  solarGroup.add(glow);

  const sunLight = new THREE.PointLight(0xfff2d8, 2.4, 0, 0); // decay 0 → reaches Neptune
  solarGroup.add(sunLight);
  solarGroup.add(new THREE.AmbientLight(0x33404f, 0.5));

  // --- Planets -------------------------------------------------------------
  const earthMaps = generateEarthMaps();
  const ringTex = toTexture(generateRings());
  const moonTex = toTexture(generateRocky({ seed: 91, base1: '#9a9a96', base2: '#5f5f5c', craters: 80 }));

  PLANET_DATA.forEach((data, idx) => {
    const orbit = new THREE.Group();
    orbit.rotation.x = THREE.MathUtils.degToRad(data.inc);
    solarGroup.add(orbit);

    // orbit path line
    const pts = [];
    for (let i = 0; i < 180; i++) {
      const a = (i / 180) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * data.dist, 0, Math.sin(a) * data.dist));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.LineLoop(lineGeo,
      new THREE.LineBasicMaterial({ color: 0x3a4a6a, transparent: true, opacity: 0.35 }));
    orbit.add(line);

    const holder = new THREE.Group();
    holder.position.set(data.dist, 0, 0);
    orbit.add(holder);

    const tiltG = new THREE.Group();
    tiltG.rotation.z = THREE.MathUtils.degToRad(data.tilt);
    holder.add(tiltG);

    let map, bumpMap = null, extra = {};
    if (data.name === 'Earth') {
      map = toTexture(earthMaps.mapC);
      bumpMap = toTexture(earthMaps.bumpC, false);
      extra.specularMap = toTexture(earthMaps.specC, false);
      extra.specular = new THREE.Color(0x223344);
      extra.shininess = 16;
    } else {
      map = toTexture(data.gen());
    }
    const mat = bumpMap
      ? new THREE.MeshPhongMaterial({ map, bumpMap, bumpScale: 0.06, ...extra })
      : new THREE.MeshStandardMaterial({ map, roughness: 0.95, metalness: 0.0 });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 48, 24), mat);
    mesh.userData.bodyIndex = idx;
    tiltG.add(mesh);
    pickables.push(mesh);

    // Saturn's rings — remap ring UVs so uv.x runs along the radius
    if (data.name === 'Saturn') {
      const inner = data.radius * 1.25, outer = data.radius * 2.3;
      const ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);
      const p = ringGeo.attributes.position;
      const uv = ringGeo.attributes.uv;
      const v3 = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) {
        v3.fromBufferAttribute(p, i);
        uv.setXY(i, (v3.length() - inner) / (outer - inner), 0.5);
      }
      uv.needsUpdate = true;
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({
        map: ringTex, transparent: true, side: THREE.DoubleSide,
        roughness: 0.9, metalness: 0.0, depthWrite: false,
      }));
      ring.rotation.x = Math.PI / 2;
      tiltG.add(ring);
    }

    // a small Moon for Earth, visible in the solar view
    if (data.name === 'Earth') {
      moonPivotSolar = new THREE.Group();
      holder.add(moonPivotSolar);
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 24, 12),
        new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1.0 })
      );
      moon.position.set(3.2, 0, 0);
      moonPivotSolar.add(moon);
    }

    const rand = mulberry32(idx * 17 + 3);
    planets.push({ data, holder, mesh, orbit, angle: rand() * Math.PI * 2 });
  });
}

/* ==========================================================================
   SECTION 7 — Detailed Earth scene (close-up mode)
   ========================================================================== */

let earthDetail = null, cloudDetail = null, moonPivotDetail = null;

function buildEarthScene() {
  const earthMaps = generateEarthMaps();
  const moonTex = toTexture(generateRocky({ seed: 91, base1: '#9a9a96', base2: '#5f5f5c', craters: 80 }));

  // Earth with bump + ocean specular
  earthDetail = new THREE.Mesh(
    new THREE.SphereGeometry(10, 96, 48),
    new THREE.MeshPhongMaterial({
      map: toTexture(earthMaps.mapC),
      bumpMap: toTexture(earthMaps.bumpC, false),
      bumpScale: 0.25,
      specularMap: toTexture(earthMaps.specC, false),
      specular: new THREE.Color(0x334455),
      shininess: 18,
    })
  );
  earthDetail.rotation.z = THREE.MathUtils.degToRad(23.4);
  earthGroup.add(earthDetail);

  // Cloud layer, drifting slowly relative to the surface
  cloudDetail = new THREE.Mesh(
    new THREE.SphereGeometry(10.12, 64, 32),
    new THREE.MeshLambertMaterial({ map: toTexture(generateClouds()), transparent: true, depthWrite: false })
  );
  cloudDetail.rotation.z = THREE.MathUtils.degToRad(23.4);
  earthGroup.add(cloudDetail);

  // Atmosphere: fresnel rim glow on a slightly larger back-faced sphere
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: { glowColor: { value: new THREE.Color(0x4a90d9) } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vView = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 glowColor;
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        float i = pow(abs(dot(normalize(vNormal), normalize(vView))), 1.8);
        gl_FragColor = vec4(glowColor, i * 0.9);
      }`,
    side: THREE.BackSide, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(10.55, 64, 32), atmoMat));

  // Moon
  moonPivotDetail = new THREE.Group();
  moonPivotDetail.rotation.x = THREE.MathUtils.degToRad(5.1);
  earthGroup.add(moonPivotDetail);
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(2.7, 48, 24),
    new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1.0 })
  );
  moon.position.set(30, 0, 0);
  moonPivotDetail.add(moon);

  // Lighting: one strong "Sun" directional light + faint ambient fill
  const dir = new THREE.DirectionalLight(0xfff3e0, 2.6);
  dir.position.set(60, 18, 40);
  earthGroup.add(dir);
  earthGroup.add(dir.target);
  earthGroup.add(new THREE.AmbientLight(0x28303c, 0.7));
}

/* ==========================================================================
   SECTION 8 — UI wiring (buttons, slider, jump menu, info panel)
   ========================================================================== */

function buildUI() {
  const $ = (id) => document.getElementById(id);

  $('btnSolar').addEventListener('click', () => setMode('solar'));
  $('btnEarth').addEventListener('click', () => setMode('earth'));
  $('btnOrbits').addEventListener('click', () => {
    state.showOrbits = !state.showOrbits;
    $('btnOrbits').textContent = `Orbits: ${state.showOrbits ? 'on' : 'off'}`;
    planets.forEach((p) => {
      p.orbit.children.forEach((child) => {
        if (child.isLine) child.visible = state.showOrbits;
      });
    });
  });
  $('btnPause').addEventListener('click', () => {
    state.paused = !state.paused;
    $('btnPause').textContent = state.paused ? 'Play' : 'Pause';
    $('btnPause').classList.toggle('active', state.paused);
  });
  $('speed').addEventListener('input', (e) => { state.timeScale = parseFloat(e.target.value); });

  const jump = $('jump');
  const opt = (v, label) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = label;
    jump.appendChild(o);
  };
  opt('-2', 'Overview');
  opt('-1', SUN_INFO.name);
  PLANET_DATA.forEach((d, i) => opt(String(i), d.name));
  jump.addEventListener('change', () => {
    const v = jump.value;
    jump.value = '';
    if (v === '') return;
    const n = parseInt(v, 10);
    if (state.mode !== 'solar') setMode('solar');
    if (n === -2) focusBody(null);
    else focusBody(n === -1 ? makeSunEntry() : planets[n]);
  });
}

function makeSunEntry() {
  return {
    data: { name: SUN_INFO.name, radius: 6, ...SUN_INFO },
    holder: solarGroup.children[0], // the sun mesh
  };
}

function updateInfoPanel() {
  const panel = document.getElementById('panel');
  const s = state.selected;
  if (!s) { panel.style.display = 'none'; return; }
  const d = s.data;
  document.getElementById('pName').textContent = d.name;
  document.getElementById('pType').textContent = d.type || '';
  document.getElementById('pDiam').textContent = d.diameter || '—';
  document.getElementById('pDist').textContent = d.au || '—';
  document.getElementById('pDay').textContent = d.day || '—';
  document.getElementById('pFact').textContent = d.fact || '';
  panel.style.display = 'block';
}

function onKeyDown(e) {
  if (e.key === 'Escape') {
    if (state.mode !== 'solar') setMode('solar');
    else focusBody(null);
  }
}

/* ==========================================================================
   SECTION 9 — Picking, camera flights, follow-cam, mode switching
   ========================================================================== */

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2(-2, -2); // off-screen by default
let downX = 0, downY = 0;

function bindPointer() {
  const el = renderer.domElement;
  el.addEventListener('pointermove', (e) => {
    pointerNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  });
  el.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
  el.addEventListener('pointerup', (e) => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // was a drag
    if (state.mode !== 'solar') return;
    raycaster.setFromCamera(pointerNdc, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    if (hits.length > 0) {
      const idx = hits[0].object.userData.bodyIndex;
      focusBody(idx === -1 ? makeSunEntry() : planets[idx]);
    }
  });
}

function updateHover() {
  if (state.mode !== 'solar') { renderer.domElement.style.cursor = ''; return; }
  raycaster.setFromCamera(pointerNdc, camera);
  const hit = raycaster.intersectObjects(pickables, false).length > 0;
  renderer.domElement.style.cursor = hit ? 'pointer' : '';
}

// Ease in-out for camera flights
function ease(t) { return t * t * (3 - 2 * t); }

/**
 * Fly the camera to a position/target. If followEntry is given, the flight
 * tracks the body's live position and the follow-cam takes over on arrival.
 */
function flyTo(toPos, toTgt, followEntry = null, dur = 1.6) {
  flight = {
    start: performance.now(),
    dur: dur * 1000,
    fromPos: camera.position.clone(),
    fromTgt: controls.target.clone(),
    toPos: toPos.clone(),
    toTgt: toTgt ? toTgt.clone() : null,
    followEntry,
    offsetDir: null,
    dist: 0,
  };
  if (followEntry) {
    const p = new THREE.Vector3();
    followEntry.holder.getWorldPosition(p);
    flight.offsetDir = camera.position.clone().sub(p).normalize();
    if (!isFinite(flight.offsetDir.x)) flight.offsetDir.set(0, 0.4, 1).normalize();
    flight.dist = Math.max(followEntry.data.radius * 5.5, 9);
  }
  controls.enabled = false;
}

function focusBody(entry) {
  state.follow = entry ? entry.holder : null;
  state.selected = entry;
  updateInfoPanel();
  if (!entry) {
    flyTo(new THREE.Vector3(0, 95, 210), new THREE.Vector3(0, 0, 0));
  } else {
    flyTo(new THREE.Vector3(), new THREE.Vector3(), entry);
  }
}

function setMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;
  solarGroup.visible = mode === 'solar';
  earthGroup.visible = mode === 'earth';
  state.follow = null;
  state.selected = null;
  updateInfoPanel();
  document.getElementById('btnSolar').classList.toggle('active', mode === 'solar');
  document.getElementById('btnEarth').classList.toggle('active', mode === 'earth');
  if (mode === 'earth') {
    controls.minDistance = 12.5;
    controls.maxDistance = 300;
    flyTo(new THREE.Vector3(16, 9, 27), new THREE.Vector3(0, 0, 0));
  } else {
    controls.minDistance = 9;
    controls.maxDistance = 900;
    flyTo(new THREE.Vector3(0, 95, 210), new THREE.Vector3(0, 0, 0));
  }
}

function updateFlightAndFollow() {
  if (flight) {
    const k = ease(Math.min(1, (performance.now() - flight.start) / flight.dur));
    let toPos = flight.toPos, toTgt = flight.toTgt;
    if (flight.followEntry) {
      const p = tmpV;
      flight.followEntry.holder.getWorldPosition(p);
      toPos = tmpV2.copy(p).addScaledVector(flight.offsetDir, flight.dist);
      toTgt = p;
    }
    camera.position.lerpVectors(flight.fromPos, toPos, k);
    controls.target.lerpVectors(flight.fromTgt, toTgt, k);
    if (k >= 1) {
      controls.enabled = true;
      if (flight.followEntry) {
        flight.followEntry.holder.getWorldPosition(state.lastFollowPos);
      }
      flight = null;
    }
  } else if (state.follow) {
    // track a moving body: shift camera by the body's frame-to-frame delta
    state.follow.getWorldPosition(tmpV);
    tmpV2.copy(tmpV).sub(state.lastFollowPos);
    camera.position.add(tmpV2);
    controls.target.copy(tmpV);
    state.lastFollowPos.copy(tmpV);
  }
}

/* ==========================================================================
   SECTION 10 — Animation loop & resize
   ========================================================================== */

const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const ts = state.paused ? 0 : state.timeScale;

  // orbital motion: angular speed ∝ 1/period (Earth completes an orbit ~12.6 s)
  for (const p of planets) {
    p.angle += (0.5 / p.data.period) * dt * ts;
    p.orbit.rotation.y = p.angle;
    p.mesh.rotation.y += p.data.spin * dt * ts;
  }
  if (moonPivotSolar) moonPivotSolar.rotation.y += 0.9 * dt * ts;

  // detailed Earth scene idle motion
  if (earthGroup.visible) {
    earthDetail.rotation.y += 0.02 * dt * ts;
    cloudDetail.rotation.y += 0.026 * dt * ts;
    moonPivotDetail.rotation.y += 0.05 * dt * ts;
  }

  updateFlightAndFollow();
  controls.update();
  updateHover();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ==========================================================================
   Boot — run after first paint so the loading overlay is visible during
   the (synchronous) texture generation.
   ========================================================================== */

window.addEventListener('load', () => {
  try {
    init();
  } catch (err) {
    const el = document.getElementById('loading');
    el.classList.remove('done');
    el.innerHTML = `<div class="err">Failed to start: ${err.message}</div>`;
    console.error(err);
  }
});
</script>
