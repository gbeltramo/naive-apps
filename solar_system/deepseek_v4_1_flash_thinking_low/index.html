<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solar System — Interactive 3D</title>
<style>
  :root {
    --ui-bg: rgba(10, 14, 24, 0.72);
    --ui-border: rgba(140, 180, 255, 0.22);
    --ui-text: #dbe6ff;
    --ui-dim: #8fa3c8;
    --accent: #6fb3ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--ui-text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- Loading overlay ---------- */
  #loader {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 45%, #0b1220 0%, #000 70%);
    z-index: 50;
    transition: opacity 0.7s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-inner { text-align: center; }
  .loader-ring {
    width: 54px; height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid rgba(111, 179, 255, 0.18);
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ui-dim);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 20;
    max-width: 300px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  #hud .sub {
    margin: 0 0 14px;
    font-size: 11px;
    color: var(--ui-dim);
    letter-spacing: 0.04em;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 9px 0;
    font-size: 12px;
  }
  .row label { color: var(--ui-dim); }
  .row output {
    font-variant-numeric: tabular-nums;
    color: var(--ui-text);
    font-size: 11px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 3px;
    background: rgba(140, 180, 255, 0.22);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    box-shadow: 0 0 10px rgba(111, 179, 255, 0.8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 14px;
  }
  button {
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--ui-text);
    background: rgba(111, 179, 255, 0.09);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    padding: 7px 8px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
  }
  button:hover { background: rgba(111, 179, 255, 0.2); border-color: rgba(111, 179, 255, 0.5); }
  button:active { transform: scale(0.97); }
  button.active {
    background: rgba(111, 179, 255, 0.32);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---------- Planet info card ---------- */
  #info {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    width: 268px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  #info.visible { opacity: 1; transform: translateY(0); }
  #info .name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #info .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex: none;
  }
  #info .type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ui-dim);
    margin-bottom: 11px;
  }
  #info .desc {
    font-size: 11.5px;
    line-height: 1.55;
    color: #b9c8e4;
    margin-bottom: 12px;
  }
  #info .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
    font-size: 10.5px;
  }
  #info .stats div span {
    display: block;
    color: var(--ui-dim);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  /* ---------- Hint ---------- */
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    color: rgba(143, 163, 200, 0.75);
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }
  #hint.fade { opacity: 0; }

  @media (max-width: 720px) {
    #hud { max-width: 210px; padding: 12px 13px; top: 12px; left: 12px; }
    #hud h1 { font-size: 13px; }
    #info { width: 210px; right: 12px; bottom: 12px; padding: 12px 13px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <div class="loader-text">Building the solar system</div>
  </div>
</div>

<div id="hud">
  <h1>SOL</h1>AR SYSTEM</h1>
  <p class="sub">Procedural · Real-time 3D</p>

  <div class="row">
    <label for="speed">Orbit speed</label>
    <output id="speedOut">1.0×</output>
  </div>
  <input type="range" id="speed" min="0" max="500" value="100" step="1" />

  <div class="btn-grid">
    <button id="btnPause">Pause</button>
    <button id="btnOrbits" class="active">Orbits</button>
    <button id="btnLabels" class="active">Labels</button>
    <button id="btnReset">Reset view</button>
  </div>
</div>

<div id="info">
  <div class="name"><span class="dot" id="infoDot"></span><span id="infoName"></span></div>
  <div class="type" id="infoType"></div>
  <div class="desc" id="infoDesc"></div>
  <div class="stats">
    <div><span>Radius</span</div></span>><b id="infoRadius"></b></div>
    <div><span>Orbit</div></span></span><b id="infoOrbit"></b></div>
    <div><span>Day</span><b</div></span> id="infoDay"></b></div>
    <div><span>Mo</div></span>ons</span><b id="infoMoons"></b></div>
  </div>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Click a planet</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
   1. CONSTANTS & PLANET DATA
   ========================================================================== */

// Scene scale: Earth radius = 1 unit. Distances are compressed for viewing.
const PLANETS = [

  },

  },

    radius: 3.4, radiusKm: 69911, distance: 36, period: 11.86, day: 0.41, tilt: 3.13,
    moons: 95, orbitColor: 0x8a7355,
    desc: 'The largest planet — a swirling ball of hydrogen and helium with a storm, the Great Red Spot, wider than Earth.',
    texture: 'bands', seed: 53, bandColors: ['#c9a97e', '#e6d3b3', '#a8835c', '#f0e2c8', '#8f6b47']
  },
  {
    name: 'Saturn', type: 'Gas giant', color: 0xe3d3a8,
    radius: 2.9, radiusKm: 58232, distance: 48, period: 29.46, day: 0.44, tilt: 26.73,
    moons: 146, orbitColor: 0x8a7d55, ring: true,
    desc: 'Famous for its bright ring system of ice and rock. So low in density it would float in a sufficiently large ocean.',
    texture: 'bands', seed: 67, bandColors: ['#d9c79a', '#efe3c2', '#c2ad7e', '#f5ecd6', '#b09a6c']
  },
  {
    name: 'Uranus', type: 'Ice giant', color: 0x9fd8dd,
    radius: 1.6, radiusKm: 25362, distance: 60, period: 84.01, day: -0.72, tilt: 97.77,
    moons: 28, orbitColor: 0x5f8f94, ring: true, ringThin: true,
    desc: 'An ice giant tipped on its side, likely by an ancient collision. Methane in its atmosphere gives it a cyan hue.',
    texture: 'bands', seed: 79, bandColors: ['#a8dde0', '#c3e9eb', '#8fcbd0', '#d5f0f1']
  },
  {
    name: 'Neptune', type: 'Ice giant', color: 0x3f63c9,
    radius: 1.55, radiusKm: 24622, distance: 70, period: 164.8, day: 0.67, tilt: 28.32,
    moons: 16, orbitColor: 0x3a4f8f,
    desc: 'The windiest world known, with supersonic storms. Its deep blue comes from methane absorbing red light.',
    texture: 'bands', seed: 89, bandColors: ['#3a5bc0', '#4f74d8', '#2e4aa3', '#6a8ce6']
  }
];

// Sun data (not in the planet array because it is the light source)
const SUN = { radius: 4.2, color: 0xffb347 };

/* ============================================================================
   2. PROCEDURAL TEXTURE GENERATION
   All textures are drawn on canvases — no external files required.
   ========================================================================== */

const TEX_W = 1024;
const TEX_H = 512;

function makeCanvas(w = TEX_W, h = TEX_H) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

// Deterministic pseudo-random generator so textures look the same each load.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Convert a canvas into a THREE texture with sensible defaults.
function canvasTexture(canvas, { repeatX = 1, repeatY = 1 } = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = 4;
  tex.needsUpdate = true;
  return tex;
}

// --- Value-noise helper: layered random blobs, cheap and seamless-ish --------
function paintNoiseBlobs(ctx, w, h, rand, count, radiusMin, radiusMax, palette, alpha = 0.5) {
  for (let i = 0; i < count; i++) {
    const x = rand() * w;
    const y = rand() * h;
    const r = radiusMin + rand() * (radiusMax - radiusMin);
    const col = palette[Math.floor(rand() * palette.length)];
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
    grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Rocky / cratered surface (Mercury) -------------------------------------
function textureRocky(seed) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.fillStyle = '#8d8177';
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  paintNoiseBlobs(ctx, TEX_W, TEX_H, rand, 420, 12, 90, [
    [120, 110, 100], [160, 150, 138], [95, 88, 80], [180, 170, 158]
  ], 0.35);

  // Craters: dark rim + lighter interior highlight
  for (let i = 0; i < 260; i++) {
    const x = rand() * TEX_W;
    const y = rand() * TEX_H;
    const r = 2 + rand() * 16;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(70,64,58,${0.18 + rand() * 0.25})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(190,180,168,${0.08 + rand() * 0.14})`;
    ctx.fill();
  }

  return canvasTexture(c);
}

// --- Soft cloudy surface (Venus) --------------------------------------------
function textureCloudy(seed) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  const base = ctx.createLinearGradient(0, 0, 0, TEX_H);
  base.addColorStop(0, '#d8b878');
  base.addColorStop(0.5, '#e9cf94');
  base.addColorStop(1, '#c9a866');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  // Horizontal streaks to suggest banded cloud flow
  for (let i = 0; i < 160; i++) {
    const y = rand() * TEX_H;
    const h = 3 + rand() * 22;
    const x = rand() * TEX_W;
    const w = 120 + rand() * 520;
    ctx.fillStyle = `rgba(${230 + rand() * 25 | 0},${205 + rand() * 30 | 0},${150 + rand() * 40 | 0},${0.05 + rand() * 0.12})`;
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  paintNoiseBlobs(ctx, TEX_W, TEX_H, rand, 220, 20, 110, [
    [255, 240, 200], [200, 170, 110], [240, 220, 170]
  ], 0.16);

  return canvasTexture(c);
}

// --- Earth: oceans, continents, ice caps, clouds ----------------------------
function textureEarth(seed) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  // Ocean base with subtle depth variation
  const ocean = ctx.createLinearGradient(0, 0, 0, TEX_H);
  ocean.addColorStop(0, '#123a6b');
  ocean.addColorStop(0.5, '#1b5c9e');
  ocean.addColorStop(1, '#123a6b');
  ctx.fillStyle = ocean;
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  paintNoiseBlobs(ctx, TEX_W, TEX_H, rand, 180, 30, 140, [
    [30, 90, 150], [20, 70, 130], [40, 110, 170]
  ], 0.22);

  // Continents: clusters of green/brown blobs
  const landPalette = [
    [58, 110, 62], [74, 128, 70], [96, 132, 74],
    [128, 118, 74], [150, 132, 88], [46, 92, 56]
  ];

  const continents = 14;
  for (let i = 0; i < continents; i++) {
    const cx = rand() * TEX_W;
    const cy = 60 + rand() * (TEX_H - 120);
    const blobs = 26 + Math.floor(rand() * 34);
    for (let j = 0; j < blobs; j++) {
      const ang = rand() * Math.PI * 2;
      const dist = Math.pow(rand(), 0.6) * (40 + rand() * 110);
      const x = cx + Math.cos(ang) * dist * 1.7;
      const y = cy + Math.sin(ang) * dist * 0.75;
      const r = 12 + rand() * 46;
      const col = landPalette[Math.floor(rand() * landPalette.length)];
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.95)`);
      g.addColorStop(0.7, `rgba(${col[0]},${col[1]},${col[2]},0.65)`);
      g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Polar ice caps
  const north = ctx.createLinearGradient(0, 0, 0, 70);
  north.addColorStop(0, 'rgba(240,248,255,0.95)');
  north.addColorStop(1, 'rgba(240,248,255,0)');
  ctx.fillStyle = north;
  ctx.fillRect(0, 0, TEX_W, 70);

  const south = ctx.createLinearGradient(0, TEX_H - 80, 0, TEX_H);
  south.addColorStop(0, 'rgba(240,248,255,0)');
  south.addColorStop(1, 'rgba(240,248,255,0.95)');
  ctx.fillStyle = south;
  ctx.fillRect(0, TEX_H - 80, TEX_W, 80);

  return canvasTexture(c);
}

// --- Mars: rusty surface with dark regions and polar caps -------------------
function textureMars(seed) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.fillStyle = '#b4552e';
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  paintNoiseBlobs(ctx, TEX_W, TEX_H, rand, 380, 15, 120, [
    [196, 100, 58], [150, 70, 40], [214, 128, 80], [120, 58, 36], [170, 88, 52]
  ], 0.3);

  // Dark basaltic regions
  for (let i = 0; i < 22; i++) {
    const x = rand() * TEX_W;
    const y = 80 + rand() * (TEX_H - 160);
    const r = 30 + rand() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(92,48,32,0.5)');
    g.addColorStop(1, 'rgba(92,48,32,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Craters
  for (let i = 0; i < 120; i++) {
    const x = rand() * TEX_W;
    const y = rand() * TEX_H;
    const r = 1.5 + rand() * 9;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(80,40,26,${0.2 + rand() * 0.25})`;
    ctx.fill();
  }

  // Polar caps
  const north = ctx.createLinearGradient(0, 0, 0, 55);
  north.addColorStop(0, 'rgba(250,250,255,0.9)');
  north.addColorStop(1, 'rgba(250,250,255,0)');
  ctx.fillStyle = north;
  ctx.fillRect(0, 0, TEX_W, 55);

  const south = ctx.createLinearGradient(0, TEX_H - 45, 0, TEX_H);
  south.addColorStop(0, 'rgba(250,250,255,0)');
  south.addColorStop(1, 'rgba(250,250,255,0.85)');
  ctx.fillStyle = south;
  ctx.fillRect(0, TEX_H - 45, TEX_W, 45);

  return canvasTexture(c);
}

// --- Banded gas giant surface ----------------------------------------------
function textureBands(seed, colors) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.fillStyle = colors[0];
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  // Horizontal bands with wavy edges
  let y = 0;
  while (y < TEX_H) {
    const h = 8 + rand() * 46;
    const col = colors[Math.floor(rand() * colors.length)];
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.55 + rand() * 0.45;
    ctx.beginPath();
    ctx.moveTo(0, y);
    const steps = 24;
    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * TEX_W;
      const wobble = Math.sin(i * 0.9 + rand() * 0.4) * (2 + rand() * 5);
      ctx.lineTo(x, y + wobble);
    }
    for (let i = steps; i >= 0; i--) {
      const x = (i / steps) * TEX_W;
      const wobble = Math.sin(i * 0.7 + rand() * 0.4) * (2 + rand() * 5);
      ctx.lineTo(x, y + h + wobble);
    }
    ctx.closePath();
    ctx.fill();
    y += h;
  }
  ctx.globalAlpha = 1;

  // Turbulent swirls
  for (let i = 0; i < 260; i++) {
    const x = rand() * TEX_W;
    const yy = rand() * TEX_H;
    const rx = 20 + rand() * 90;
    const ry = 2 + rand() * 9;
    ctx.fillStyle = `rgba(255,255,255,${0.02 + rand() * 0.06})`;
    ctx.beginPath();
    ctx.ellipse(x, yy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Soft blur pass using a scaled-down redraw (cheap atmospheric smoothing)
  const small = makeCanvas(TEX_W / 4, TEX_H / 4);
  const sctx = small.getContext('2d');
  sctx.drawImage(c, 0, 0, small.width, small.height);
  ctx.globalAlpha = 0.45;
  ctx.drawImage(small, 0, 0, TEX_W, TEX_H);
  ctx.globalAlpha = 1;

  return canvasTexture(c);
}

// --- Sun surface: granulated plasma ----------------------------------------
function textureSun(seed) {
  const c = makeCanvas();
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.fillStyle = '#ff9a1f';
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  paintNoiseBlobs(ctx, TEX_W, TEX_H, rand, 500, 10, 70, [
    [255, 220, 120], [255, 160, 40], [255, 120, 20], [255, 245, 190]
  ], 0.35);

  // Granulation cells
  for (let i = 0; i < 900; i++) {
    const x = rand() * TEX_W;
    const y = rand() * TEX_H;
    const r = 2 + rand() * 9;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,${200 + rand() * 55 | 0},${80 + rand() * 100 | 0},${0.05 + rand() * 0.12})`;
    ctx.fill();
  }

  return canvasTexture(c);
}

// --- Ring texture (radial gradient with gaps) ------------------------------
function textureRing(seed, tint) {
  const w = 512;
  const c = makeCanvas(w, 8);
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.clearRect(0, 0, w, 8);

  // Draw vertical strips; alpha varies to create ring gaps
  for (let x = 0; x < w; x++) {
    const t = x / w;
    // Base density profile: brighter in the middle, fading at edges
    let a = Math.sin(t * Math.PI) * 0.85;
    // Cassini-like gaps
    if (t > 0.42 && t < 0.47) a *= 0.12;
    if (t > 0.62 && t < 0.655) a *= 0.2;
    if (t > 0.78 && t < 0.8) a *= 0.35;
    // Fine grain
    a *= 0.75 + rand() * 0.25;
    a = Math.max(0, Math.min(1, a));

    const shade = 0.75 + rand() * 0.25;
    const r = Math.round(tint[0] * shade);
    const g = Math.round(tint[1] * shade);
    const b = Math.round(tint[2] * shade);
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.fillRect(x, 0, 1, 8);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 4;
  return tex;
}

// --- Glow sprite (radial gradient) -----------------------------------------
function textureGlow(inner = 'rgba(255,220,150,1)', outer = 'rgba(255,140,30,0)') {
  const size = 256;
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, inner);
  g.addColorStop(0.25, 'rgba(255,190,90,0.55)');
  g.addColorStop(0.55, 'rgba(255,140,40,0.18)');
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// --- Star field background (equirectangular) -------------------------------
function textureStars(seed) {
  const w = 2048, h = 1024;
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);

  ctx.fillStyle = '#02030a';
  ctx.fillRect(0, 0, w, h);

  // Faint nebula clouds
  paintNoiseBlobs(ctx, w, h, rand, 40, 80, 320, [
    [30, 45, 90], [50, 30, 80], [20, 55, 80], [60, 40, 100]
  ], 0.09);

  // Stars with varied brightness and slight colour tint
  for (let i = 0; i < 5200; i++) {
    const x = rand() * w;
    const y = rand() * h;
    const r = Math.pow(rand(), 3) * 1.9 + 0.25;
    const tint = rand();
    let col;
    if (tint < 0.15) col = '190,210,255';
    else if (tint < 0.3) col = '255,235,200';
    else if (tint < 0.36) col = '255,200,170';
    else col = '255,255,255';
    const a = 0.25 + rand() * 0.75;
    ctx.fillStyle = `rgba(${col},${a})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // A few brighter stars with halos
  for (let i = 0; i < 60; i++) {
    const x = rand() * w;
    const y = rand() * h;
    const r = 1.6 + rand() * 2.2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.3, 'rgba(200,220,255,0.35)');
    g.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 5, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

/* ============================================================================
   3. RENDERER, SCENE, CAMERA
   ========================================================================== */

const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  4000
);
camera.position.set(0, 42, 96);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 320;
controls.target.set(0, 0, 0);

/* ============================================================================
   4. LIGHTING
   ========================================================================== */

// The Sun is the primary light source (point light at origin).
const sunLight = new THREE.PointLight(0xfff2d8, 3.2, 0, 0.0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// Very dim ambient so night sides are not pure black.
const ambient = new THREE.AmbientLight(0x2a3550, 0.55);
scene.add(ambient);

// Subtle fill from above to keep the scene readable.
const fill = new THREE.DirectionalLight(0x8fb4ff, 0.18);
fill.position.set(-1, 1, 1);
scene.add(fill);

/* ============================================================================
   5. STARFIELD
   ========================================================================== */

const starTexture = textureStars(7);
const starSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 48, 32),
  new THREE.MeshBasicMaterial({
    map: starTexture,
    side: THREE.BackSide,
    depthWrite: false,
    toneMapped: false
  })
);
scene.add(starSphere);

/* ============================================================================
   6. THE SUN
   ========================================================================== */

const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunTexture = textureSun(3);
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SUN.radius, 64, 48),
  new THREE.MeshBasicMaterial({ map: sunTexture, toneMapped: false })
);
sunGroup.add(sunMesh);

// Additive glow shell around the Sun
const glowTexture = textureGlow();
const sunGlow = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map: glowTexture,
    color: 0xffb347,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  })
);
sunGlow.scale.setScalar(SUN.radius * 6.5);
sunGroup.add(sunGlow);

// Second, wider halo for a softer falloff
const sunHalo = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map: glowTexture,
    color: 0xff7a1a,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  })
);
sunHalo.scale.setScalar(SUN.radius * 13);
sunGroup.add(sunHalo);

/* ============================================================================
   7. PLANETS
   ========================================================================== */

const planetObjects = [];   // { data, group, mesh, orbitLine, label, angle }
const clickable = [];       // meshes for raycasting

// Shared sphere geometry resolution — low-poly enough for speed, smooth enough visually.
const SPHERE_SEGMENTS = 48;
const SPHERE_RINGS = 32;

// Build the texture for a planet based on its descriptor.
function buildPlanetTexture(data) {
  switch (data.texture) {
    case 'rocky':  return textureRocky(data.seed);
    case 'cloudy': return textureCloudy(data.seed);
    case 'earth':  return textureEarth(data.seed);
    case 'mars':   return textureMars(data.seed);
    case 'bands':  return textureBands(data.seed, data.bandColors);
    default:       return textureRocky(data.seed);
  }
}

// Create a circular orbit line in the XZ plane.
function makeOrbitLine(radius, color) {
  const points = [];
  const segments = 256;
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.28,
    depthWrite: false
  });
  return new THREE.LineLoop(geo, mat);
}

// Create a text label sprite for a planet name.
function makeLabel(text, colorHex) {
  const pad = 24;
  const fontSize = 44;
  const measureCanvas = makeCanvas(8, 8);
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
  const textWidth = mctx.measureText(text).width;

  const w = Math.ceil(textWidth + pad * 2);
  const h = fontSize + pad * 2;

  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.font = `600 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Soft dark backing for legibility against bright planets
  ctx.fillStyle = 'rgba(4, 8, 16, 0.55)';
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(w - r, 0);
  ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(r, h);
  ctx.arc(r, r, r, Math.PI / 2, -Math.PI / 2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = colorHex;
  ctx.fillText(text, w / 2, h / 2 + 2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    toneMapped: false
  });
  const sprite = new THREE.Sprite(mat);
  const scale = 0.011;
  sprite.scale.set(w * scale, h * scale, 1);
  // Remember the natural aspect so distance-based scaling keeps it intact.
  sprite.userData.baseWidth = w * scale;
  sprite.userData.baseHeight = h * scale;
  sprite.renderOrder = 10;
  return sprite;
}

// Build all planets.
for (const data of PLANETS) {
  const group = new THREE.Group();          // orbit pivot at the Sun
  group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(group);

  // Orbit line lives in the scene (not the rotating pivot) so it stays static.
  const orbitLine = makeOrbitLine(data.distance, data.orbitColor);
  scene.add(orbitLine);

  // Planet holder positioned along the orbit.
  const holder = new THREE.Group();
  holder.position.x = data.distance;
  group.add(holder);

  // Tilted planet mesh
  const tiltGroup = new THREE.Group();
  tiltGroup.rotation.z = THREE.MathUtils.degToRad(data.tilt);
  holder.add(tiltGroup);

  const texture = buildPlanetTexture(data);
  const material = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: data.texture === 'bands' ? 0.85 : 0.95,
    metalness: 0.0
  });

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(data.radius, SPHERE_SEGMENTS, SPHERE_RINGS),
    material
  );
  mesh.userData.planet = data;
  tiltGroup.add(mesh);
  clickable.push(mesh);

  // Rings for Saturn and Uranus
  if (data.ring) {
    const inner = data.radius * (data.ringThin ? 1.5 : 1.35);
    const outer = data.radius * (data.ringThin ? 1.85 : 2.35);
    const ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);

    // Remap UVs so the ring texture runs radially outward.
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    const v3 = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      const t = (v3.length() - inner) / (outer - inner);
      uv.setXY(i, t, 0.5);
    }
    uv.needsUpdate = true;

    const tint = data.ringThin ? [150, 200, 205] : [226, 208, 168];
    const ringTex = textureRing(data.seed + 5, tint);
    const ringMat = new THREE.MeshBasicMaterial({
      map: ringTex,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      opacity: data.ringThin ? 0.5 : 0.95,
      toneMapped: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    tiltGroup.add(ring);
  }

  // Label floats above the planet
  const label = makeLabel(data.name, '#cfe0ff');
  label.position.y = data.radius + 0.9;
  holder.add(label);

  planetObjects.push({
    data,
    group,
    holder,
    mesh,
    orbitLine,
    label,
    angle: group.rotation.y
  });
}

/* ============================================================================
   8. EARTH'S MOON
   ========================================================================== */

const earthObj = planetObjects.find(p => p.data.name === 'Earth');
let moonPivot = null;
let moonMesh = null;

if (earthObj) {
  moonPivot = new THREE.Group();
  earthObj.holder.add(moonPivot);

  const moonTexture = textureRocky(101);
  moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.27, 32, 24),
    new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 1.0, metalness: 0.0 })
  );
  moonMesh.position.x = 2.1;
  moonPivot.add(moonMesh);
}

/* ============================================================================
   9. ASTEROID BELT (instanced points for performance)
   ========================================================================== */

const BELT_INNER = 28.5;
const BELT_OUTER = 32.5;
const BELT_COUNT = 2600;

const beltGeometry = new THREE.BufferGeometry();
{
  const positions = new Float32Array(BELT_COUNT * 3);
  const rand = mulberry32(2024);
  for (let i = 0; i < BELT_COUNT; i++) {
    const r = BELT_INNER + rand() * (BELT_OUTER - BELT_INNER);
    const a = rand() * Math.PI * 2;
    const y = (rand() - 0.5) * 1.6 * (0.4 + rand() * 0.6);
    positions[i * 3 + 0] = Math.cos(a) * r;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(a) * r;
  }
  beltGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
}

const beltMaterial = new THREE.PointsMaterial({
  color: 0xb9a98f,
  size: 0.45,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.75,
  depthWrite: false
});
const asteroidBelt = new THREE.Points(beltGeometry, beltMaterial);
scene.add(asteroidBelt);

/* ============================================================================
   10. UI WIRING
   ========================================================================== */

const ui = {
  speed: document.getElementById('speed'),
  speedOut: document.getElementById('speedOut'),
  pause: document.getElementById('btnPause'),
  orbits: document.getElementById('btnOrbits'),
  labels: document.getElementById('btnLabels'),
  reset: document.getElementById('btnReset'),
  info: document.getElementById('info'),
  infoDot: document.getElementById('infoDot'),
  infoName: document.getElementById('infoName'),
  infoType: document.getElementById('infoType'),
  infoDesc: document.getElementById('infoDesc'),
  infoRadius: document.getElementById('infoRadius'),
  infoOrbit: document.getElementById('infoOrbit'),
  infoDay: document.getElementById('infoDay'),
  infoMoons: document.getElementById('infoMoons'),
  hint: document.getElementById('hint'),
  loader: document.getElementById('loader')
};

let paused = false;
let showOrbits = true;
let showLabels = true;
let timeScale = 1.0;

// Convert slider value (0..500) to a multiplier (0..5).
function sliderToScale(v) {
  return (v / 100) * 1.0;
}

ui.speed.addEventListener('input', () => {
  timeScale = sliderToScale(Number(ui.speed.value));
  ui.speedOut.textContent = timeScale.toFixed(1) + '×';
});

ui.pause.addEventListener('click', () => {
  paused = !paused;
  ui.pause.textContent = paused ? 'Resume' : 'Pause';
  ui.pause.classList.toggle('active', paused);
});

ui.orbits.addEventListener('click', () => {
  showOrbits = !showOrbits;
  ui.orbits.classList.toggle('active', showOrbits);
  for (const p of planetObjects) p.orbitLine.visible = showOrbits;
});

ui.labels.addEventListener('click', () => {
  showLabels = !showLabels;
  ui.labels.classList.toggle('active', showLabels);
  for (const p of planetObjects) p.label.visible = showLabels;
});

ui.reset.addEventListener('click', () => {
  camera.position.set(0, 42, 96);
  controls.target.set(0, 0, 0);
  controls.update();
  hideInfo();
});

// Fade the hint after a few seconds of interaction.
let hintTimer = setTimeout(() => ui.hint.classList.add('fade'), 7000);
renderer.domElement.addEventListener('pointerdown', () => {
  clearTimeout(hintTimer);
  ui.hint.classList.add('fade');
}, { once: true });

/* ============================================================================
   11. PLANET SELECTION (raycasting)
   ========================================================================== */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownPos = null;
let selected = null;

function showInfo(data) {
  const hex = '#' + new THREE.Color(data.color).getHexString();
  ui.infoDot.style.background = hex;
  ui.infoDot.style.boxShadow = `0 0 10px ${hex}`;
  ui.infoName.textContent = data.name;
  ui.infoType.textContent = data.type;
  ui.infoDesc.textContent = data.desc;
  ui.infoRadius.textContent = data.radiusKm.toLocaleString() + ' km';
  ui.infoOrbit.textContent = data.period < 1
    ? (data.period * 365.25).toFixed(0) + ' days'
    : data.period.toFixed(2) + ' yr';
  ui.infoDay.textContent = Math.abs(data.day).toFixed(2) + ' d' + (data.day < 0 ? ' (retro)' : '');
  ui.infoMoons.textContent = data.moons;
  ui.info.classList.add('visible');
}

function hideInfo() {
  ui.info.classList.remove('visible');
  selected = null;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  pointerDownPos = null;

  // Ignore drags — only treat as a click if the pointer barely moved.
  if (dx * dx + dy * dy > 36) return;

  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(clickable, false);
  if (hits.length > 0) {
    const data = hits[0].object.userData.planet;
    selected = hits[0].object;
    showInfo(data);
  } else {
    hideInfo();
  }
});

/* ============================================================================
   12. RESIZE HANDLING
   ========================================================================== */

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ============================================================================
   13. ANIMATION LOOP
   ========================================================================== */

const clock = new THREE.Clock();
const labelWorldPos = new THREE.Vector3();

// Base orbital angular speed for Earth (radians per second at 1×).
const EARTH_ORBIT_SPEED = 0.16;
const EARTH_SPIN_SPEED = 0.55;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05); // clamp to avoid jumps after tab switch
  const t = clock.elapsedTime;

  if (!paused) {
    const step = dt * timeScale;

    // Sun rotation and gentle glow pulse
    sunMesh.rotation.y += step * 0.06;
    const pulse = 1 + Math.sin(t * 1.4) * 0.025;
    sunGlow.scale.setScalar(SUN.radius * 6.5 * pulse);
    sunHalo.scale.setScalar(SUN.radius * 13 * pulse);

    // Planets: orbital revolution + axial spin
    for (const p of planetObjects) {
      const d = p.data;
      // Orbital angular speed scaled by 1/period (Kepler-ish compression).
      const orbitSpeed = EARTH_ORBIT_SPEED / Math.pow(d.period, 0.62);
      p.group.rotation.y += step * orbitSpeed;

      // Axial spin — sign of `day` encodes retrograde rotation.
      const spin = EARTH_SPIN_SPEED / Math.abs(d.day) * Math.sign(d.day || 1);
      p.mesh.rotation.y += step * spin * 0.9;
    }

    // Moon orbit
    if (moonPivot) {
      moonPivot.rotation.y += step * 1.6;
      if (moonMesh) moonMesh.rotation.y += step * 0.4;
    }

    // Asteroid belt slow drift
    asteroidBelt.rotation.y += step * 0.02;
  }

  // Keep labels at a readable size regardless of distance (subtle scaling).
  if (showLabels) {
    for (const p of planetObjects) {
      p.holder.getWorldPosition(labelWorldPos);
      const dist = camera.position.distanceTo(labelWorldPos);
      const s = THREE.MathUtils.clamp(dist * 0.012, 0.55, 2.4);
      p.label.scale.set(
        p.label.userData.baseWidth * s,
        p.label.userData.baseHeight * s,
        1
      );
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

/* ============================================================================
   14. BOOT
   ========================================================================== */

// Hide the loader once the first frame is ready.
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    ui.loader.classList.add('hidden');
    setTimeout(() => { ui.loader.style.display = 'none'; }, 800);
  });
});

// Prevent context menu on right-drag (OrbitControls uses it for panning).
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
