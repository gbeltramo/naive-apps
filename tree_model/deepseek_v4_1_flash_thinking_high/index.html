<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Tree — Wind & Shadows</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(13, 19, 23, 0.82);
      --line: rgba(255, 255, 255, 0.10);
      --text: #e8f0e8;
      --muted: #9fb3a6;
      --accent: #8fd16a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1014;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b1014;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 20;
      transition: opacity 0.7s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 306px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 14px 16px 16px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.48);
      color: var(--text);
      font-size: 12px;
      line-height: 1.35;
      user-select: none;
      z-index: 10;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }
    #ui::-webkit-scrollbar { width: 8px; }
    #ui::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    #ui .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    #ui h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    #ui h1 span { color: var(--accent); }

    #collapse {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    #collapse:hover { background: rgba(255, 255, 255, 0.11); }

    #ui.collapsed .body { display: none; }

    .section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .control { margin: 0 0 9px; }
    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .control-head label { color: #c9d8cd; }
    .val {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      white-space: nowrap;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .seed-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-top: 2px;
    }
    input[type="number"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      user-select: text;
    }
    input[type="number"]:focus {
      outline: 1px solid rgba(143, 209, 106, 0.65);
      outline-offset: 0;
    }

    button {
      border: 1px solid rgba(143, 209, 106, 0.35);
      background: rgba(143, 209, 106, 0.14);
      color: #d7f2c4;
      border-radius: 8px;
      padding: 7px 11px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: rgba(143, 209, 106, 0.24); }
    button:active { transform: translateY(1px); }

    .toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
      color: #c9d8cd;
    }
    .toggle:hover { background: rgba(255, 255, 255, 0.07); }
    .toggle input {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      margin: 0;
      cursor: pointer;
    }

    #stats {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
    }

    #fps {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 7px 10px;
      border-radius: 9px;
      background: rgba(13, 19, 23, 0.72);
      border: 1px solid var(--line);
      color: var(--accent);
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      z-index: 10;
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.52);
      font-size: 11px;
      letter-spacing: 0.04em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    @media (max-width: 640px) {
      #ui {
        top: 10px;
        left: 10px;
        width: min(306px, calc(100vw - 20px));
        max-height: calc(100vh - 20px);
      }
      #fps { top: 10px; right: 10px; }
      #hint { display: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="loading">Growing tree…</div>

  <div id="ui">
    <div class="head">
      <h1>Procedural <span>Tree</span></h1>
      <button id="collapse" aria-label="Collapse panel" title="Collapse panel">−</button>
    </div>

    <div class="body">
      <div class="section">
        <h2>Seed</h2>
        <div class="seed-row">
          <input id="seed" type="number" min="0" max="999999999" step="1" value="1337" aria-label="Seed" />
          <button id="regen">Regenerate</button>
        </div>
      </div>

      <div class="section">
        <h2>Tree</h2>

        <div class="control">
          <div class="control-head"><label for="trunk-height">Trunk height</label><span class="val" id="v-trunk-height">7.0</span></div>
          <input id="trunk-height" type="range" min="3" max="12" step="0.1" value="7" />
        </div>

        <div class="control">
          <div class="control-head"><label for="trunk-radius">Trunk radius</label><span class="val" id="v-trunk-radius">0.45</span></div>
          <input id="trunk-radius" type="range" min="0.15" max="0.8" step="0.01" value="0.45" />
        </div>

        <div class="control">
          <div class="control-head"><label for="depth">Branching depth</label><span class="val" id="v-depth">6</span></div>
          <input id="depth" type="range" min="3" max="7" step="1" value="6" />
        </div>

        <div class="control">
          <div class="control-head"><label for="branch-angle">Branch angle</label><span class="val" id="v-branch-angle">32°</span></div>
          <input id="branch-angle" type="range" min="10" max="70" step="1" value="32" />
        </div>

        <div class="control">
          <div class="control-head"><label for="length-decay">Length decay</label><span class="val" id="v-length-decay">0.72</span></div>
          <input id="length-decay" type="range" min="0.5" max="0.9" step="0.01" value="0.72" />
        </div>

        <div class="control">
          <div class="control-head"><label for="radius-decay">Radius decay</label><span class="val" id="v-radius-decay">0.68</span></div>
          <input id="radius-decay" type="range" min="0.5" max="0.9" step="0.01" value="0.68" />
        </div>

        <div class="control">
          <div class="control-head"><label for="droop">Gravity droop</label><span class="val" id="v-droop">0.50</span></div>
          <input id="droop" type="range" min="0" max="1.5" step="0.05" value="0.5" />
        </div>
      </div>

      <div class="section">
        <h2>Leaves</h2>

        <div class="control">
          <div class="control-head"><label for="leaf-count">Leaf count</label><span class="val" id="v-leaf-count">8000</span></div>
          <input id="leaf-count" type="range" min="2000" max="20000" step="500" value="8000" />
        </div>

        <div class="toggles">
          <label class="toggle"><input id="autumn" type="checkbox" /><span>Autumn</span></label>
          <label class="toggle"><input id="shadows" type="checkbox" checked /><span>Shadows</span></label>
        </div>
      </div>

      <div class="section">
        <h2>Wind</h2>

        <div class="control">
          <div class="control-head"><label for="wind-strength">Strength</label><span class="val" id="v-wind-strength">0.80</span></div>
          <input id="wind-strength" type="range" min="0" max="2" step="0.05" value="0.8" />
        </div>

        <div class="control">
          <div class="control-head"><label for="wind-direction">Direction</label><span class="val" id="v-wind-direction">35°</span></div>
          <input id="wind-direction" type="range" min="0" max="360" step="1" value="35" />
        </div>

        <div class="control">
          <div class="control-head"><label for="gust-frequency">Gust frequency</label><span class="val" id="v-gust-frequency">0.60</span></div>
          <input id="gust-frequency" type="range" min="0.1" max="2" step="0.05" value="0.6" />
        </div>
      </div>

      <div class="section">
        <h2>Sun</h2>

        <div class="control">
          <div class="control-head"><label for="sun-elevation">Elevation</label><span class="val" id="v-sun-elevation">42°</span></div>
          <input id="sun-elevation" type="range" min="5" max="85" step="1" value="42" />
        </div>

        <div class="control">
          <div class="control-head"><label for="sun-azimuth">Azimuth</label><span class="val" id="v-sun-azimuth">135°</span></div>
          <input id="sun-azimuth" type="range" min="0" max="360" step="1" value="135" />
        </div>
      </div>

      <div id="stats">Preparing…</div>
    </div>
  </div>

  <div id="fps">-- FPS</div>
  <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================
    // SETUP
    // ============================================================

    const app = document.getElementById('app');
    const loadingEl = document.getElementById('loading');
    const fpsEl = document.getElementById('fps');
    const statsEl = document.getElementById('stats');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xbfd8e8, 1);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xcfe3f2, 35, 150);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(16, 11, 20);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2;
    controls.maxDistance = 90;
    controls.minPolarAngle = 0.05;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.update();

    // Sky dome: a camera-centred gradient sphere with a soft sun glow.
    const skyUniforms = {
      uTop: { value: new THREE.Color(0x2f6fa8) },
      uBottom: { value: new THREE.Color(0xd9ecf7) },
      uSunDir: { value: new THREE.Vector3(0.5, 0.6, 0.5).normalize() },
      uSunColor: { value: new THREE.Color(0xfff2cf) }
    };

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(500, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: skyUniforms,
        vertexShader: /* glsl */`
          varying vec3 vWorldPosition;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */`
          varying vec3 vWorldPosition;
          uniform vec3 uTop;
          uniform vec3 uBottom;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;

          void main() {
            vec3 dir = normalize(vWorldPosition);
            float h = clamp(dir.y, 0.0, 1.0);
            vec3 col = mix(uBottom, uTop, pow(h, 0.65));

            float sun = max(dot(dir, normalize(uSunDir)), 0.0);
            col += uSunColor * pow(sun, 350.0) * 1.5;
            col += uSunColor * pow(sun, 8.0) * 0.08;

            gl_FragColor = vec4(col, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      })
    );
    sky.frustumCulled = false;
    sky.renderOrder = -1;
    scene.add(sky);

    // Lighting
    const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x3d4a2f, 0.75);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 200;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const sunTarget = new THREE.Object3D();
    scene.add(sunTarget);
    sun.target = sunTarget;

    // ============================================================
    // PROCEDURAL TEXTURES (canvas 2D, no external images)
    // ============================================================

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp255(v) {
      return v < 0 ? 0 : v > 255 ? 255 : v;
    }

    function makeBarkTextures() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const rng = mulberry32(90210);

      // Base bark colour.
      ctx.fillStyle = '#5a3d28';
      ctx.fillRect(0, 0, size, size);

      // Long vertical fibres.
      for (let i = 0; i < 1100; i++) {
        const x = rng() * size;
        const y = rng() * size;
        const w = 1 + rng() * 6;
        const h = 40 + rng() * 420;
        const shade = 24 + rng() * 58;
        ctx.fillStyle = `rgba(${shade + 42},${shade + 22},${shade + 4},${0.12 + rng() * 0.34})`;
        ctx.fillRect(x, y, w, h);
      }

      // Short horizontal cracks.
      for (let i = 0; i < 160; i++) {
        const x = rng() * size;
        const y = rng() * size;
        const w = 8 + rng() * 46;
        ctx.strokeStyle = `rgba(24,14,8,${0.18 + rng() * 0.35})`;
        ctx.lineWidth = 0.7 + rng() * 2.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y + (rng() - 0.5) * 5);
        ctx.stroke();
      }

      // Knots.
      for (let i = 0; i < 16; i++) {
        const x = rng() * size;
        const y = rng() * size;
        const r = 4 + rng() * 15;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(28,16,9,0.92)');
        g.addColorStop(0.55, 'rgba(70,45,28,0.62)');
        g.addColorStop(1, 'rgba(90,61,40,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fine grain noise.
      const image = ctx.getImageData(0, 0, size, size);
      for (let i = 0; i < image.data.length; i += 4) {
        const n = (rng() - 0.5) * 24;
        image.data[i] = clamp255(image.data[i] + n);
        image.data[i + 1] = clamp255(image.data[i + 1] + n);
        image.data[i + 2] = clamp255(image.data[i + 2] + n);
      }
      ctx.putImageData(image, 0, 0);

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // Derive a normal map from the luminance of the bark colour map.
      const src = ctx.getImageData(0, 0, size, size).data;
      const nCanvas = document.createElement('canvas');
      nCanvas.width = nCanvas.height = size;
      const nCtx = nCanvas.getContext('2d');
      const nImage = nCtx.createImageData(size, size);
      const strength = 2.4;

      const lum = (x, y) => {
        const i = (y * size + x) * 4;
        return (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) / 255;
      };

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const lx = lum((x + 1) % size, y) - lum((x - 1 + size) % size, y);
          const ly = lum(x, (y + 1) % size) - lum(x, (y - 1 + size) % size);

          let nx = -lx * strength;
          let ny = ly * strength;
          let nz = 1.0;
          const len = Math.hypot(nx, ny, nz) || 1;
          nx /= len;
          ny /= len;
          nz /= len;

          const i = (y * size + x) * 4;
          nImage.data[i] = (nx * 0.5 + 0.5) * 255;
          nImage.data[i + 1] = (ny * 0.5 + 0.5) * 255;
          nImage.data[i + 2] = (nz * 0.5 + 0.5) * 255;
          nImage.data[i + 3] = 255;
        }
      }
      nCtx.putImageData(nImage, 0, 0);

      const normalMap = new THREE.CanvasTexture(nCanvas);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return { map, normalMap };
    }

    function makeLeafTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      // Pointed leaf silhouette with the stem at the bottom of the quad.
      ctx.beginPath();
      ctx.moveTo(128, 246);
      ctx.bezierCurveTo(42, 202, 30, 92, 128, 12);
      ctx.bezierCurveTo(226, 92, 214, 202, 128, 246);
      ctx.closePath();

      const g = ctx.createLinearGradient(0, size, 0, 0);
      g.addColorStop(0, '#6f8f3a');
      g.addColorStop(0.45, '#cfe08a');
      g.addColorStop(1, '#f2f7c8');
      ctx.fillStyle = g;
      ctx.fill();

      // Central vein.
      ctx.strokeStyle = 'rgba(66, 86, 28, 0.48)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(128, 244);
      ctx.lineTo(128, 22);
      ctx.stroke();

      // Side veins.
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(66, 86, 28, 0.34)';
      for (let i = 0; i < 7; i++) {
        const y = 52 + i * 26;
        const spread = 46 - i * 3.5;
        ctx.beginPath();
        ctx.moveTo(128, y);
        ctx.quadraticCurveTo(128 - spread * 0.55, y + 10, 128 - spread, y + 30);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(128, y);
        ctx.quadraticCurveTo(128 + spread * 0.55, y + 10, 128 + spread, y + 30);
        ctx.stroke();
      }

      // Stem.
      ctx.strokeStyle = '#5d6b2a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(128, 244);
      ctx.lineTo(128, 256);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeGrassTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const rng = mulberry32(4242);

      ctx.fillStyle = '#4f6b32';
      ctx.fillRect(0, 0, size, size);

      // Soft patches.
      for (let i = 0; i < 320; i++) {
        const x = rng() * size;
        const y = rng() * size;
        const r = 10 + rng() * 62;
        const shade = rng();
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${40 + shade * 34},${70 + shade * 44},${30 + shade * 22},0.24)`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Individual blades.
      for (let i = 0; i < 5200; i++) {
        const x = rng() * size;
        const y = rng() * size;
        const len = 2 + rng() * 8;
        const angle = (rng() - 0.5) * 0.9;
        ctx.strokeStyle = `rgba(${58 + rng() * 54},${88 + rng() * 64},${38 + rng() * 32},${0.22 + rng() * 0.42})`;
        ctx.lineWidth = 0.6 + rng() * 1.3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.sin(angle) * len, y - Math.cos(angle) * len);
        ctx.stroke();
      }

      // Subtle grain.
      const image = ctx.getImageData(0, 0, size, size);
      for (let i = 0; i < image.data.length; i += 4) {
        const n = (rng() - 0.5) * 16;
        image.data[i] = clamp255(image.data[i] + n);
        image.data[i + 1] = clamp255(image.data[i + 1] + n);
        image.data[i + 2] = clamp255(image.data[i + 2] + n);
      }
      ctx.putImageData(image, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(70, 70);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const barkTextures = makeBarkTextures();
    const leafTexture = makeLeafTexture();
    const grassTexture = makeGrassTexture();

    // Ground
    const groundMaterial = new THREE.MeshStandardMaterial({
      map: grassTexture,
      color: 0xffffff,
      roughness: 1.0,
      metalness: 0.0
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ============================================================
    // WIND SHADER PATCH
    // ============================================================

    const windUniforms = {
      uTime: { value: 0 },
      uWindStrength: { value: 0.8 },
      uWindDir: { value: new THREE.Vector2(1, 0) },
      uGustFreq: { value: 0.6 }
    };

    const WIND_COMMON = /* glsl */`
      uniform float uTime;
      uniform float uWindStrength;
      uniform vec2 uWindDir;
      uniform float uGustFreq;

      attribute float aWind;
      attribute float aPhase;

      vec4 vWindWorldPos;

      // Smooth gust envelope: two low-frequency sines multiplied together.
      float windGust(float t, float phase) {
        float g = 0.55 + 0.45 * sin(t * uGustFreq + phase * 0.7);
        g *= 0.65 + 0.35 * sin(t * uGustFreq * 0.43 + 1.7 + phase * 0.3);
        return clamp(g, 0.0, 1.0);
      }
    `;

    function patchWindMaterial(material, isLeaf) {
      material.onBeforeCompile = (shader) => {
        // Share the same uniform objects across every wind material so a
        // single update drives branches, leaves and both depth materials.
        shader.uniforms.uTime = windUniforms.uTime;
        shader.uniforms.uWindStrength = windUniforms.uWindStrength;
        shader.uniforms.uWindDir = windUniforms.uWindDir;
        shader.uniforms.uGustFreq = windUniforms.uGustFreq;

        const leafDecl = isLeaf ? 'attribute float aFlutter;' : '';

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>\n${WIND_COMMON}\n${leafDecl}`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             float windFlex = ${isLeaf ? 'clamp(position.y, 0.0, 1.0)' : '1.0'};`
          )
          .replace(
            '#include <project_vertex>',
            /* glsl */`
              vec4 mvPosition = vec4(transformed, 1.0);
              #ifdef USE_INSTANCING
                mvPosition = instanceMatrix * mvPosition;
              #endif

              // Work in world space so the same displacement can be applied
              // to the shadow depth pass.
              vec4 windWorld = modelMatrix * mvPosition;

              float gust = windGust(uTime, aPhase);
              float sway = sin(uTime * 1.15 + aPhase + windWorld.y * 0.12) * 0.6
                         + sin(uTime * 0.47 + aPhase * 1.7 + windWorld.x * 0.05) * 0.4;

              vec3 windDir3 = vec3(uWindDir.x, 0.0, uWindDir.y);
              vec3 windOffset = windDir3 * (gust * sway * uWindStrength * aWind);
              windOffset.y += sin(uTime * 1.7 + aPhase) * 0.12 * uWindStrength * aWind;

              ${isLeaf ? `
              // Higher-frequency flutter, anchored at the leaf stem.
              float f1 = sin(uTime * 8.0 + aFlutter + windWorld.x * 1.7);
              float f2 = cos(uTime * 6.3 + aFlutter * 1.3 + windWorld.z * 1.9);
              windOffset += vec3(f1, f2 * 0.6, f2)
                          * (0.055 * uWindStrength * windFlex * (0.45 + 0.55 * gust));
              ` : ''}

              windWorld.xyz += windOffset;
              vWindWorldPos = windWorld;

              mvPosition = viewMatrix * windWorld;
              gl_Position = projectionMatrix * mvPosition;
            `
          )
          .replace(
            '#include <worldpos_vertex>',
            'vec4 worldPosition = vWindWorldPos;'
          );
      };

      material.customProgramCacheKey = () => (isLeaf ? 'wind-leaf' : 'wind-branch');
    }

    // Shared materials: reused across rebuilds, so only geometries and
    // instanced buffers need disposal.
    const branchMaterial = new THREE.MeshStandardMaterial({
      map: barkTextures.map,
      normalMap: barkTextures.normalMap,
      normalScale: new THREE.Vector2(0.9, 0.9),
      roughness: 0.95,
      metalness: 0.0,
      color: 0xffffff
    });
    patchWindMaterial(branchMaterial, false);

    const branchDepthMaterial = new THREE.MeshDepthMaterial({
      depthPacking: THREE.RGBADepthPacking
    });
    patchWindMaterial(branchDepthMaterial, false);

    const leafMaterial = new THREE.MeshStandardMaterial({
      map: leafTexture,
      alphaTest: 0.4,
      side: THREE.DoubleSide,
      roughness: 0.85,
      metalness: 0.0,
      color: 0xffffff
    });
    patchWindMaterial(leafMaterial, true);

    const leafDepthMaterial = new THREE.MeshDepthMaterial({
      depthPacking: THREE.RGBADepthPacking,
      map: leafTexture,
      alphaTest: 0.4,
      side: THREE.DoubleSide
    });
    patchWindMaterial(leafDepthMaterial, true);

    // ============================================================
    // TREE GENERATION
    // ============================================================

    function generateTree(params) {
      const rng = mulberry32(params.seed >>> 0);

      const positions = [];
      const normals = [];
      const uvs = [];
      const heights = [];
      const radials = [];
      const phases = [];
      const indices = [];
      const anchors = [];

      let branchCount = 0;
      const maxBranches = 9000;
      const maxDepth = params.depth;

      const tmpU = new THREE.Vector3();
      const tmpV = new THREE.Vector3();
      const up = new THREE.Vector3();

      function orthoBasis(dir, outU, outV) {
        if (Math.abs(dir.y) > 0.95) up.set(1, 0, 0);
        else up.set(0, 1, 0);
        outU.crossVectors(up, dir).normalize();
        outV.crossVectors(dir, outU).normalize();
      }

      // Append a tapered, open-ended cylinder between a and b.
      function addSegment(a, b, r0, r1, radialSegments, phase, vOffset) {
        const seg = b.clone().sub(a);
        const len = seg.length();
        if (len < 1e-5) return 0;
        seg.normalize();

        orthoBasis(seg, tmpU, tmpV);

        const dr = r0 - r1;
        const uRepeat = Math.max(1, Math.round((Math.PI * 2 * Math.max(r0, r1)) / 0.55));
        const vRepeat = len / 0.55;
        const base = positions.length / 3;

        for (let j = 0; j < 2; j++) {
          const center = j === 0 ? a : b;
          const r = j === 0 ? r0 : r1;

          for (let i = 0; i <= radialSegments; i++) {
            const ang = (i / radialSegments) * Math.PI * 2;
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);

            const rx = tmpU.x * ca + tmpV.x * sa;
            const ry = tmpU.y * ca + tmpV.y * sa;
            const rz = tmpU.z * ca + tmpV.z * sa;

            positions.push(center.x + rx * r, center.y + ry * r, center.z + rz * r);

            // Tapered side normal.
            let nx = rx * len + seg.x * dr;
            let ny = ry * len + seg.y * dr;
            let nz = rz * len + seg.z * dr;
            const nl = Math.hypot(nx, ny, nz) || 1;
            normals.push(nx / nl, ny / nl, nz / nl);

            uvs.push((i / radialSegments) * uRepeat, vOffset + (j === 0 ? 0 : vRepeat));
            heights.push(center.y);
            radials.push(Math.hypot(center.x, center.z));
            phases.push(phase);
          }
        }

        const ring = radialSegments + 1;
        for (let i = 0; i < radialSegments; i++) {
          const a0 = base + i;
          const b0 = base + i + 1;
          const c0 = base + ring + i;
          const d0 = base + ring + i + 1;
          indices.push(a0, b0, c0, b0, d0, c0);
        }

        return vRepeat;
      }

      function grow(startPos, startDir, length, radius, depth) {
        if (branchCount >= maxBranches) return;
        branchCount++;

        const phase = rng() * Math.PI * 2;
        const isTrunk = depth === maxDepth;
        const segs = isTrunk ? 6 : (depth >= maxDepth - 1 ? 4 : 3);
        const segLen = length / segs;
        const droopScale = isTrunk ? 0.18 : 1.0;

        const pos = startPos.clone();
        const dir = startDir.clone().normalize();

        let vAccum = 0;
        let midPos = null;
        let midDir = null;
        let midRadius = radius;

        for (let i = 0; i < segs; i++) {
          // Gravity droop: bend the growth direction downward a little.
          dir.y -= params.droop * 0.055 * droopScale;
          if (dir.lengthSq() < 1e-6) dir.set(0, 1, 0);
          dir.normalize();

          const nextPos = pos.clone().addScaledVector(dir, segLen);

          const t0 = i / segs;
          const t1 = (i + 1) / segs;
          const r0 = radius * (1 - 0.45 * t0);
          const r1 = radius * (1 - 0.45 * t1);

          const radialSegments = isTrunk ? 10 : (depth >= maxDepth - 2 ? 7 : 5);
          vAccum += addSegment(pos, nextPos, r0, r1, radialSegments, phase, vAccum);

          if (depth === 0) {
            // Leaf anchors along terminal twigs.
            for (let k = 0; k < 2; k++) {
              const t = (k + 0.5) / 2;
              anchors.push({
                pos: pos.clone().lerp(nextPos, t),
                dir: dir.clone(),
                phase,
                radius: r0 * (1 - t) + r1 * t
              });
            }
          }

          if (i === Math.floor(segs * 0.65)) {
            midPos = pos.clone();
            midDir = dir.clone();
            midRadius = r0;
          }

          pos.copy(nextPos);
        }

        if (depth === 0) {
          anchors.push({
            pos: pos.clone(),
            dir: dir.clone(),
            phase,
            radius: radius * 0.55
          });
          return;
        }

        // Children at the tip.
        const childCount = depth > maxDepth - 2 ? 3 : (rng() < 0.35 ? 3 : 2);
        const angleBase = THREE.MathUtils.degToRad(params.branchAngle);

        const bu = new THREE.Vector3();
        const bv = new THREE.Vector3();
        orthoBasis(dir, bu, bv);

        const azOffset = rng() * Math.PI * 2;

        for (let c = 0; c < childCount; c++) {
          const angle = angleBase * (0.75 + rng() * 0.5);
          const az = azOffset + (c / childCount) * Math.PI * 2 + (rng() - 0.5) * 0.7;
          const ca = Math.cos(angle);
          const sa = Math.sin(angle);
          const cosAz = Math.cos(az);
          const sinAz = Math.sin(az);

          const childDir = new THREE.Vector3(
            dir.x * ca + (bu.x * cosAz + bv.x * sinAz) * sa,
            dir.y * ca + (bu.y * cosAz + bv.y * sinAz) * sa,
            dir.z * ca + (bu.z * cosAz + bv.z * sinAz) * sa
          );
          childDir.y += 0.12;
          childDir.normalize();

          const childLength = length * params.lengthDecay * (0.82 + rng() * 0.36);
          const childRadius = Math.max(
            radius * 0.55 * params.radiusDecay * (0.88 + rng() * 0.24),
            0.012
          );

          grow(pos, childDir, childLength, childRadius, depth - 1);
        }

        // Occasional mid-branch to fill out the canopy.
        if (depth >= 2 && midPos && rng() < 0.45) {
          const angle = angleBase * (0.9 + rng() * 0.5);
          const az = rng() * Math.PI * 2;
          const ca = Math.cos(angle);
          const sa = Math.sin(angle);
          const cosAz = Math.cos(az);
          const sinAz = Math.sin(az);

          const childDir = new THREE.Vector3(
            midDir.x * ca + (bu.x * cosAz + bv.x * sinAz) * sa,
            midDir.y * ca + (bu.y * cosAz + bv.y * sinAz) * sa,
            midDir.z * ca + (bu.z * cosAz + bv.z * sinAz) * sa
          );
          childDir.y += 0.1;
          childDir.normalize();

          grow(
            midPos,
            childDir,
            length * params.lengthDecay * 0.7,
            Math.max(midRadius * params.radiusDecay * 0.8, 0.012),
            depth - 1
          );
        }
      }

      grow(
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 1, 0),
        params.trunkHeight,
        params.trunkRadius,
        params.depth
      );

      // Normalise wind weights once the final tree extents are known.
      let maxHeight = 0.001;
      let maxRadius = 0.001;
      for (let i = 0; i < heights.length; i++) {
        if (heights[i] > maxHeight) maxHeight = heights[i];
        if (radials[i] > maxRadius) maxRadius = radials[i];
      }

      const winds = new Float32Array(heights.length);
      for (let i = 0; i < heights.length; i++) {
        const h = Math.max(0, heights[i]) / maxHeight;
        const r = radials[i] / maxRadius;
        winds[i] = Math.pow(Math.min(h, 1), 1.6) * 0.55 + Math.min(r, 1) * 0.12;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setAttribute('aWind', new THREE.Float32BufferAttribute(winds, 1));
      geometry.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));
      geometry.setIndex(indices);
      geometry.computeBoundingSphere();

      return {
        geometry,
        anchors,
        maxHeight,
        maxRadius,
        branchCount
      };
    }

    // ============================================================
    // LEAVES
    // ============================================================

    let treeMesh = null;
    let leafMesh = null;
    let currentAnchors = [];
    let currentMaxHeight = 1;
    let currentMaxRadius = 1;
    let lastBranchCount = 0;
    let leafColorSeeds = new Float32Array(0);
    let hasFramed = false;

    function applyLeafColor(index, color) {
      const v = leafColorSeeds[index * 2];
      const v2 = leafColorSeeds[index * 2 + 1];

      if (state.autumn) {
        // Red / orange / yellow.
        color.setHSL(0.015 + v * 0.115, 0.68 + v2 * 0.28, 0.36 + v * 0.2);
      } else {
        // Green to yellow-green.
        color.setHSL(0.20 + v * 0.12, 0.45 + v2 * 0.35, 0.29 + v * 0.22);
      }
    }

    function applyLeafColors() {
      if (!leafMesh || !leafMesh.instanceColor) return;
      const color = new THREE.Color();
      for (let i = 0; i < leafMesh.count; i++) {
        applyLeafColor(i, color);
        leafMesh.setColorAt(i, color);
      }
      leafMesh.instanceColor.needsUpdate = true;
    }

    function buildLeaves() {
      // Dispose the previous leaf mesh and its per-instance geometry.
      if (leafMesh) {
        scene.remove(leafMesh);
        leafMesh.geometry.dispose();
        leafMesh.dispose();
        leafMesh = null;
      }

      if (!currentAnchors.length) return;

      const count = Math.max(1, Math.floor(state.leafCount));
      const rng = mulberry32((state.seed ^ 0x9e3779b9) >>> 0);

      const geometry = new THREE.PlaneGeometry(1, 1, 1, 1);
      geometry.translate(0, 0.5, 0);

      const aWind = new Float32Array(count);
      const aPhase = new Float32Array(count);
      const aFlutter = new Float32Array(count);
      leafColorSeeds = new Float32Array(count * 2);

      const mesh = new THREE.InstancedMesh(geometry, leafMaterial, count);
      mesh.name = 'leaves';
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      mesh.customDepthMaterial = leafDepthMaterial;

      const dummy = new THREE.Object3D();
      const color = new THREE.Color();
      const anchorCount = currentAnchors.length;

      for (let i = 0; i < count; i++) {
        const anchor = currentAnchors[i % anchorCount];

        // Scatter around the anchor so leaves do not sit in a perfect line.
        dummy.position.set(
          anchor.pos.x + (rng() - 0.5) * 0.34,
          anchor.pos.y + (rng() - 0.5) * 0.34,
          anchor.pos.z + (rng() - 0.5) * 0.34
        );

        dummy.quaternion.setFromEuler(new THREE.Euler(
          (rng() - 0.5) * Math.PI * 1.2,
          rng() * Math.PI * 2,
          (rng() - 0.5) * Math.PI * 1.2,
          'YXZ'
        ));

        const s = 0.22 + rng() * 0.22;
        dummy.scale.set(s, s * (0.9 + rng() * 0.3), s);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);

        // Match the branch sway at the anchor, then add per-leaf flutter.
        const h = Math.max(0, anchor.pos.y) / currentMaxHeight;
        const r = Math.hypot(anchor.pos.x, anchor.pos.z) / currentMaxRadius;
        aWind[i] = Math.pow(Math.min(h, 1), 1.6) * 0.55 + Math.min(r, 1) * 0.12;
        aPhase[i] = anchor.phase;
        aFlutter[i] = rng() * Math.PI * 2;

        leafColorSeeds[i * 2] = rng();
        leafColorSeeds[i * 2 + 1] = rng();
        applyLeafColor(i, color);
        mesh.setColorAt(i, color);
      }

      geometry.setAttribute('aWind', new THREE.InstancedBufferAttribute(aWind, 1));
      geometry.setAttribute('aPhase', new THREE.InstancedBufferAttribute(aPhase, 1));
      geometry.setAttribute('aFlutter', new THREE.InstancedBufferAttribute(aFlutter, 1));

      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

      leafMesh = mesh;
      scene.add(leafMesh);
    }

    // ============================================================
    // SUN / SHADOW FITTING
    // ============================================================

    function updateSun() {
      const elev = THREE.MathUtils.degToRad(state.sunElevation);
      const az = THREE.MathUtils.degToRad(state.sunAzimuth);

      const dir = new THREE.Vector3(
        Math.cos(elev) * Math.sin(az),
        Math.sin(elev),
        Math.cos(elev) * Math.cos(az)
      ).normalize();

      skyUniforms.uSunDir.value.copy(dir);

      // Warmer, dimmer light near the horizon.
      const warm = new THREE.Color(0xffb36b);
      const white = new THREE.Color(0xfff4dd);
      const t = THREE.MathUtils.smoothstep(Math.sin(elev), 0.0, 0.5);
      sun.color.copy(warm).lerp(white, t);
      sun.intensity = 1.6 + 2.0 * t;
      skyUniforms.uSunColor.value.copy(sun.color);

      if (!treeMesh) return;

      const sphere = treeMesh.geometry.boundingSphere;
      if (!sphere) return;

      const center = sphere.center;
      const radius = Math.max(sphere.radius, 2);

      // Low sun casts long shadows, so widen the fitted shadow camera.
      const stretch = 1 + (1 - Math.sin(elev)) * 1.4;
      const extent = radius * 1.35 * Math.min(stretch, 3.2);

      sunTarget.position.copy(center);
      sun.position.copy(center).addScaledVector(dir, radius * 4.5);

      const cam = sun.shadow.camera;
      cam.left = -extent;
      cam.right = extent;
      cam.top = extent;
      cam.bottom = -extent;
      cam.near = 0.5;
      cam.far = radius * 10;
      cam.updateProjectionMatrix();

      sunTarget.updateMatrixWorld();
    }

    function frameTree(force) {
      if (!treeMesh) return;
      const sphere = treeMesh.geometry.boundingSphere;
      if (!sphere) return;

      const center = sphere.center;
      const radius = Math.max(sphere.radius, 2);

      controls.target.copy(center);

      const dir = camera.position.clone().sub(controls.target);
      let dist = dir.length();
      if (dist < 1e-3) {
        dir.set(1, 0.6, 1);
        dist = 1;
      }
      dir.normalize();

      const desired = radius * 2.0;
      if (force || dist < radius * 1.2 || dist > radius * 4.5) {
        camera.position.copy(controls.target).addScaledVector(dir, desired);
      }

      controls.update();
    }

    // ============================================================
    // UI STATE
    // ============================================================

    const state = {
      seed: 1337,
      trunkHeight: 7,
      trunkRadius: 0.45,
      depth: 6,
      branchAngle: 32,
      lengthDecay: 0.72,
      radiusDecay: 0.68,
      droop: 0.5,
      leafCount: 8000,
      windStrength: 0.8,
      windDirection: 35,
      gustFrequency: 0.6,
      sunElevation: 42,
      sunAzimuth: 135,
      shadows: true,
      autumn: false
    };

    let ready = false;
    let pendingTree = false;
    let pendingLeaves = false;
    let rebuildTimer = 0;

    function scheduleRebuild(tree) {
      if (!ready) return;
      if (tree) pendingTree = true;
      else pendingLeaves = true;

      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(() => {
        rebuildTimer = 0;
        if (pendingTree) {
          pendingTree = false;
          pendingLeaves = false;
          rebuildTree();
        } else if (pendingLeaves) {
          pendingLeaves = false;
          rebuildLeavesOnly();
        }
      }, 120);
    }

    function updateStats(branches, leaves, ms) {
      const parts = [
        `${branches.toLocaleString()} branches`,
        `${leaves.toLocaleString()} leaves`
      ];
      if (ms > 0) parts.push(`${ms.toFixed(0)} ms build`);
      statsEl.textContent = parts.join(' · ');
    }

    function rebuildTree() {
      const t0 = performance.now();

      const result = generateTree(state);

      if (treeMesh) {
        scene.remove(treeMesh);
        treeMesh.geometry.dispose();
        treeMesh = null;
      }

      treeMesh = new THREE.Mesh(result.geometry, branchMaterial);
      treeMesh.castShadow = true;
      treeMesh.receiveShadow = true;
      treeMesh.customDepthMaterial = branchDepthMaterial;
      scene.add(treeMesh);

      currentAnchors = result.anchors;
      currentMaxHeight = result.maxHeight;
      currentMaxRadius = result.maxRadius;
      lastBranchCount = result.branchCount;

      buildLeaves();
      updateSun();
      frameTree(!hasFramed);
      hasFramed = true;

      updateStats(lastBranchCount, state.leafCount, performance.now() - t0);
    }

    function rebuildLeavesOnly() {
      buildLeaves();
      updateStats(lastBranchCount, state.leafCount, 0);
    }

    function bindRange(id, key, format, onChange) {
      const input = document.getElementById(id);
      const out = document.getElementById('v-' + id);

      const update = () => {
        state[key] = parseFloat(input.value);
        if (out) out.textContent = format ? format(state[key]) : input.value;
        if (onChange && ready) onChange(state[key]);
      };

      input.addEventListener('input', update);
      update();
    }

    bindRange('trunk-height', 'trunkHeight', v => v.toFixed(1), () => scheduleRebuild(true));
    bindRange('trunk-radius', 'trunkRadius', v => v.toFixed(2), () => scheduleRebuild(true));
    bindRange('depth', 'depth', v => v.toFixed(0), () => scheduleRebuild(true));
    bindRange('branch-angle', 'branchAngle', v => v.toFixed(0) + '°', () => scheduleRebuild(true));
    bindRange('length-decay', 'lengthDecay', v => v.toFixed(2), () => scheduleRebuild(true));
    bindRange('radius-decay', 'radiusDecay', v => v.toFixed(2), () => scheduleRebuild(true));
    bindRange('droop', 'droop', v => v.toFixed(2), () => scheduleRebuild(true));

    bindRange('leaf-count', 'leafCount', v => v.toFixed(0), () => scheduleRebuild(false));

    bindRange('wind-strength', 'windStrength', v => v.toFixed(2), v => {
      windUniforms.uWindStrength.value = v;
    });
    bindRange('wind-direction', 'windDirection', v => v.toFixed(0) + '°', v => {
      const r = THREE.MathUtils.degToRad(v);
      windUniforms.uWindDir.value.set(Math.cos(r), Math.sin(r));
    });
    bindRange('gust-frequency', 'gustFrequency', v => v.toFixed(2), v => {
      windUniforms.uGustFreq.value = v;
    });

    bindRange('sun-elevation', 'sunElevation', v => v.toFixed(0) + '°', updateSun);
    bindRange('sun-azimuth', 'sunAzimuth', v => v.toFixed(0) + '°', updateSun);

    const seedInput = document.getElementById('seed');
    seedInput.addEventListener('change', () => {
      state.seed = Math.max(0, Math.floor(Number(seedInput.value) || 0));
      seedInput.value = state.seed;
      scheduleRebuild(true);
    });

    document.getElementById('regen').addEventListener('click', () => {
      state.seed = Math.floor(Math.random() * 1e9);
      seedInput.value = state.seed;
      scheduleRebuild(true);
    });

    const shadowsToggle = document.getElementById('shadows');
    shadowsToggle.addEventListener('change', () => {
      state.shadows = shadowsToggle.checked;
      renderer.shadowMap.enabled = state.shadows;
      sun.castShadow = state.shadows;

      // Shadow defines change, so force the affected programs to rebuild.
      branchMaterial.needsUpdate = true;
      leafMaterial.needsUpdate = true;
      branchDepthMaterial.needsUpdate = true;
      leafDepthMaterial.needsUpdate = true;
      groundMaterial.needsUpdate = true;
    });

    const autumnToggle = document.getElementById('autumn');
    autumnToggle.addEventListener('change', () => {
      state.autumn = autumnToggle.checked;
      applyLeafColors();
    });

    const ui = document.getElementById('ui');
    const collapseButton = document.getElementById('collapse');
    collapseButton.addEventListener('click', () => {
      ui.classList.toggle('collapsed');
      const collapsed = ui.classList.contains('collapsed');
      collapseButton.textContent = collapsed ? '+' : '−';
      collapseButton.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel');
    });

    function syncEnvironment() {
      windUniforms.uWindStrength.value = state.windStrength;

      const windRad = THREE.MathUtils.degToRad(state.windDirection);
      windUniforms.uWindDir.value.set(Math.cos(windRad), Math.sin(windRad));
      windUniforms.uGustFreq.value = state.gustFrequency;

      updateSun();
    }

    // ============================================================
    // RESIZE, FPS & RENDER LOOP
    // ============================================================

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let fpsFrames = 0;
    let fpsLast = performance.now();

    function updateFps(now) {
      fpsFrames++;
      if (now - fpsLast >= 500) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsLast));
        fpsEl.textContent = `${fps} FPS`;
        fpsFrames = 0;
        fpsLast = now;
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      const t = clock.getElapsedTime();
      windUniforms.uTime.value = t;

      controls.update();

      // Keep the sky centred on the camera so the gradient stays stable.
      sky.position.copy(camera.position);

      renderer.render(scene, camera);
      updateFps(performance.now());
    }

    // Initial build.
    rebuildTree();
    syncEnvironment();
    ready = true;

    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.remove(), 900);

    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
