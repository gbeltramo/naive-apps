<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural 3D Tree Generator</title>
<style>
  /* ---------- UI styling ---------- */
  :root {
    --panel-bg: rgba(18, 24, 20, 0.86);
    --accent: #8fd67a;
    --text: #e6efe6;
    --muted: #9db3a2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d130f; color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #panel {
    position: absolute; top: 12px; left: 12px; width: 268px;
    max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel-bg); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.09); border-radius: 12px;
    padding: 14px 14px 12px; z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #panel h1 {
    margin: 0 0 10px; font-size: 15px; font-weight: 600;
    letter-spacing: 0.02em; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  #panel h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  fieldset {
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    margin: 0 0 10px; padding: 8px 10px 10px;
  }
  legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px; }
  .row { margin: 7px 0 0; }
  .row label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .row label b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  input[type=number] {
    width: 84px; background: #0d130f; color: var(--text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 4px 6px; font: inherit;
  }
  .seedrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  button {
    background: var(--accent); color: #0d130f; border: 0; border-radius: 6px;
    padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  .toggles { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  #hud {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; padding: 8px 12px; min-width: 116px;
    backdrop-filter: blur(8px); font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #hud .fps { font-size: 22px; font-weight: 600; color: var(--accent); }
  #hud .sub { color: var(--muted); font-size: 11px; }
  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 11px; z-index: 5;
    background: rgba(0,0,0,0.25); padding: 4px 10px; border-radius: 999px;
    pointer-events: none;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1><span class="dot"></span> Procedural Tree</h1>

    <fieldset>
      <legend>Structure</legend>
      <div class="row seedrow">
        <label for="seed">Seed</label>
        <div style="display:flex;gap:6px">
          <input type="number" id="seed" value="7" min="0" max="999999" />
          <button id="regen" title="Generate a new tree">Regenerate</button>
        </div>
      </div>
      <div class="row">
        <label for="depth">Branching depth <b id="depthV">5</b></label>
        <input type="range" id="depth" min="3" max="7" step="1" value="5" />
      </div>
      <div class="row">
        <label for="trunkH">Trunk height <b id="trunkHV">4.0</b></label>
        <input type="range" id="trunkH" min="2" max="7" step="0.1" value="4" />
      </div>
      <div class="row">
        <label for="trunkR">Trunk radius <b id="trunkRV">0.28</b></label>
        <input type="range" id="trunkR" min="0.08" max="0.6" step="0.01" value="0.28" />
      </div>
      <div class="row">
        <label for="angle">Branch angle <b id="angleV">36°</b></label>
        <input type="range" id="angle" min="15" max="70" step="1" value="36" />
      </div>
      <div class="row">
        <label for="lenDecay">Length decay <b id="lenDecayV">0.74</b></label>
        <input type="range" id="lenDecay" min="0.5" max="0.9" step="0.01" value="0.74" />
      </div>
      <div class="row">
        <label for="radDecay">Radius decay <b id="radDecayV">0.70</b></label>
        <input type="range" id="radDecay" min="0.45" max="0.88" step="0.01" value="0.70" />
      </div>
      <div class="row">
        <label for="droop">Gravity droop <b id="droopV">0.18</b></label>
        <input type="range" id="droop" min="0" max="0.8" step="0.01" value="0.18" />
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="autumn" /> Autumn colors</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Foliage &amp; Wind</legend>
      <div class="row">
        <label for="leafCount">Leaf count <b id="leafCountV">9000</b></label>
        <input type="range" id="leafCount" min="2000" max="20000" step="500" value="9000" />
      </div>
      <div class="row">
        <label for="wind">Wind strength <b id="windV">1.00</b></label>
        <input type="range" id="wind" min="0" max="3" step="0.05" value="1" />
      </div>
      <div class="row">
        <label for="windDir">Wind direction <b id="windDirV">45°</b></label>
        <input type="range" id="windDir" min="0" max="360" step="1" value="45" />
      </div>
      <div class="row">
        <label for="gust">Gust frequency <b id="gustV">0.50</b></label>
        <input type="range" id="gust" min="0.05" max="2" step="0.05" value="0.5" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Lighting</legend>
      <div class="row">
        <label for="sunElev">Sun elevation <b id="sunElevV">42°</b></label>
        <input type="range" id="sunElev" min="5" max="88" step="1" value="42" />
      </div>
      <div class="row">
        <label for="sunAzim">Sun azimuth <b id="sunAzimV">135°</b></label>
        <input type="range" id="sunAzim" min="0" max="360" step="1" value="135" />
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="shadows" checked /> Shadows</label>
      </div>
    </fieldset>
  </div>

  <div id="hud">
    <div class="fps" id="fps">--</div>
    <div class="sub"><span id="branches">0</span> branches · <span id="leaves">0</span> leaves</div>
    <div class="sub" id="triangles">0 tris</div>
  </div>

  <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================================
   SECTION 1 — SETUP: renderer, scene, camera, controls, lights, ground
   ========================================================================== */

const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));   // cap DPR at 2
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9dcd6, 45, 150);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(9, 6, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 3.4, 0);
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3;
controls.maxDistance = 60;

// --- lights ---------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x5b7a4a, 0.75);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
scene.add(sun);
scene.add(sun.target);

function updateSun() {
  const el = THREE.MathUtils.degToRad(parseFloat(state.sunElev));
  const az = THREE.MathUtils.degToRad(parseFloat(state.sunAzim));
  const r = 30;
  sun.position.set(
    r * Math.cos(el) * Math.cos(az),
    r * Math.sin(el),
    r * Math.cos(el) * Math.sin(az)
  );
  sun.target.position.set(0, 3, 0);

  // tightly fit the ortho shadow camera around the tree
  const sc = sun.shadow.camera;
  sc.left = -9; sc.right = 9; sc.top = 13; sc.bottom = -5;
  sc.near = Math.max(0.5, r - 18); sc.far = r + 18;
  sc.updateProjectionMatrix();

  const day = THREE.MathUtils.clamp(Math.sin(el), 0, 1);
  sun.intensity = 0.6 + 2.0 * day;
  sun.color.setHSL(0.09 - 0.04 * (1 - day), 0.55, 0.55 + 0.12 * day);
}

// --- sky: gradient dome shader (no external assets) -----------------------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x4f8fd6) },
    mid: { value: new THREE.Color(0x9dc6e8) },
    bot: { value: new THREE.Color(0xdfe9df) },
    sunDir: { value: new THREE.Vector3(0, 1, 0) },
    sunTint: { value: new THREE.Color(0xfff0d0) }
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 top, mid, bot, sunTint;
    uniform vec3 sunDir;
    varying vec3 vDir;
    void main() {
      float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = h > 0.5 ? mix(mid, top, (h - 0.5) * 2.0) : mix(bot, mid, h * 2.0);
      float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
      col += sunTint * (pow(s, 64.0) * 0.55 + pow(s, 8.0) * 0.07);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(190, 32, 18), skyMat);
scene.add(sky);

// --- ground: procedural grass texture ------------------------------------
const grassTex = makeGrassTexture();
grassTex.colorSpace = THREE.SRGBColorSpace;
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(60, 60);
grassTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(160, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ map: grassTex, color: 0x9fbb7d, roughness: 0.95, metalness: 0 })
);
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================================
   SECTION 2 — TEXTURES: bark (with normal-like variation), leaf alpha, grass
   ========================================================================== */

function makeBarkTextures() {
  const w = 256, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rng = mulberry32(1234);

  // base brown
  g.fillStyle = '#5b4633'; g.fillRect(0, 0, w, h);

  // long vertical bark furrows
  for (let i = 0; i < 160; i++) {
    const x = rng() * w;
    const wid = 2 + rng() * 9;
    const shade = rng();
    const base = shade < 0.55 ? 52 : 92;
    const r = base + rng() * 40, gg = base * 0.78 + rng() * 26, b = base * 0.58 + rng() * 18;
    g.strokeStyle = `rgba(${r | 0},${gg | 0},${b | 0},${0.25 + rng() * 0.45})`;
    g.lineWidth = wid;
    g.beginPath();
    let cx = x;
    g.moveTo(cx, -20);
    for (let y = -20; y < h + 20; y += 24) {
      cx += (rng() - 0.5) * 9;
      g.lineTo(cx, y);
    }
    g.stroke();
  }
  // fine speckle
  for (let i = 0; i < 5000; i++) {
    const v = 40 + rng() * 90;
    g.fillStyle = `rgba(${v | 0},${(v * 0.8) | 0},${(v * 0.6) | 0},${0.05 + rng() * 0.12})`;
    g.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 3);
  }

  // grayscale height map -> normal-like texture
  const h2 = document.createElement('canvas'); h2.width = w; h2.height = h;
  const hg = h2.getContext('2d');
  hg.filter = 'grayscale(1) contrast(1.8)';
  hg.drawImage(c, 0, 0);
  const src = hg.getImageData(0, 0, w, h).data;

  const nc = document.createElement('canvas'); nc.width = w; nc.height = h;
  const ng = nc.getContext('2d');
  const nd = ng.createImageData(w, h);
  const H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  const strength = 2.6;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
      const dy = (H(x, y + 1) - H(x, y - 1)) * strength;
      const n = new THREE.Vector3(-dx, -dy, 1).normalize();
      const i = (y * w + x) * 4;
      nd.data[i] = (n.x * 0.5 + 0.5) * 255;
      nd.data[i + 1] = (n.y * 0.5 + 0.5) * 255;
      nd.data[i + 2] = (n.z * 0.5 + 0.5) * 255;
      nd.data[i + 3] = 255;
    }
  }
  ng.putImageData(nd, 0, 0);

  const color = new THREE.CanvasTexture(c);
  color.colorSpace = THREE.SRGBColorSpace;
  color.wrapS = color.wrapT = THREE.RepeatWrapping;
  color.repeat.set(3, 6);

  const normal = new THREE.CanvasTexture(nc);
  normal.wrapS = normal.wrapT = THREE.RepeatWrapping;
  normal.repeat.set(3, 6);

  return { color, normal };
}

function makeLeafTexture() {
  const w = 128, h = 128;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);

  // pointed oval leaf silhouette
  g.save();
  g.translate(w / 2, h / 2);
  g.beginPath();
  g.moveTo(0, -56);
  g.bezierCurveTo(34, -28, 34, 26, 0, 56);
  g.bezierCurveTo(-34, 26, -34, -28, 0, -56);
  g.closePath();
  const grad = g.createLinearGradient(0, -56, 0, 56);
  grad.addColorStop(0, '#e8ffe0');
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, '#d8f0c8');
  g.fillStyle = grad;
  g.fill();
  g.clip();

  // midrib + veins (visible on the texture as subtle shading)
  g.strokeStyle = 'rgba(120,160,90,0.55)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, -56); g.lineTo(0, 58); g.stroke();
  g.lineWidth = 1.6;
  for (let i = -4; i <= 4; i++) {
    const y = i * 11;
    g.beginPath();
    g.moveTo(0, y);
    g.quadraticCurveTo(16, y + 7, 27, y + 15);
    g.moveTo(0, y);
    g.quadraticCurveTo(-16, y + 7, -27, y + 15);
    g.stroke();
  }
  g.restore();

  // soft edge darkening for shape definition
  g.strokeStyle = 'rgba(90,140,70,0.5)';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(w / 2, 4);
  g.bezierCurveTo(w / 2 + 32, 30, w / 2 + 32, 90, w / 2, 116);
  g.bezierCurveTo(w / 2 - 32, 90, w / 2 - 32, 30, w / 2, 4);
  g.stroke();

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function makeGrassTexture() {
  const w = 256, h = 256;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rng = mulberry32(99);
  g.fillStyle = '#7f9d5e'; g.fillRect(0, 0, w, h);
  // mottled patches
  for (let i = 0; i < 900; i++) {
    const x = rng() * w, y = rng() * h, r = 4 + rng() * 26;
    const v = rng();
    g.fillStyle = v < 0.5 ? 'rgba(96,124,64,0.10)' : 'rgba(150,176,104,0.10)';
    g.beginPath(); g.ellipse(x, y, r, r * 0.6, rng() * 3, 0, Math.PI * 2); g.fill();
  }
  // grass blades
  for (let i = 0; i < 4000; i++) {
    const x = rng() * w, y = rng() * h;
    const l = 3 + rng() * 7;
    const a = -Math.PI / 2 + (rng() - 0.5) * 0.9;
    const v = 90 + rng() * 100;
    g.strokeStyle = `rgba(${(v * 0.78) | 0},${v | 0},${(v * 0.5) | 0},0.5)`;
    g.lineWidth = 0.8 + rng() * 0.8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================================
   SECTION 3 — SEEDED RNG + TREE GENERATION (recursive, merged cylinders)
   ========================================================================== */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const bark = makeBarkTextures();
const leafTex = makeLeafTexture();

const WIND_CHUNK = /* glsl */`
  {
    float h = clamp(position.y / 11.0, 0.0, 1.0);
    #ifdef USE_INSTANCING
      vec4 wp0 = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    #else
      vec4 wp0 = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    #endif
    float distTrunk = length(wp0.xz);
    vec2 dir = vec2(cos(uWindDir), sin(uWindDir));
    float g1 = sin(uTime * uGustFreq * 1.7 + wp0.x * 0.22 + wp0.z * 0.17);
    float g2 = sin(uTime * uGustFreq * 0.61 + wp0.y * 0.35 + 1.7);
    float g3 = sin(uTime * uGustFreq * 3.3 + (wp0.x + wp0.z) * 0.5);
    float gust = 0.55 + 0.45 * sin(g1 * 1.6 + g2 * 1.1 + g3 * 0.4);
    float sway = uWindStrength * gust * h * h * (0.55 + 0.055 * distTrunk);
    #ifdef USE_INSTANCING
      float phase = instanceMatrix[3][0] * 0.6 + instanceMatrix[3][2] * 0.6 + instanceMatrix[3][1] * 0.9;
    #else
      float phase = 0.0;
    #endif
    float flut = uWindStrength * gust * (0.05 + 0.09 * h)
               * sin(uTime * (3.6 + uGustFreq * 2.2) + phase)
               * sin(uTime * 7.3 + phase * 2.0);
    float swayX = sway * dir.x + flut * dir.x + 0.02 * uWindStrength * h * sin(uTime * 1.3 + phase);
    float swayZ = sway * dir.y + flut * dir.y + 0.02 * uWindStrength * h * cos(uTime * 1.1 + phase);
    float droopY = -0.45 * (swayX * swayX + swayZ * swayZ) - 0.06 * flut * flut;
    transformed.x += swayX;
    transformed.z += swayZ;
    transformed.y += droopY;
  }
`;

const windUniforms = {
  uTime: { value: 0 },
  uWindStrength: { value: 1 },
  uWindDir: { value: THREE.MathUtils.degToRad(45) },
  uGustFreq: { value: 0.5 }
};

/** Inject wind uniforms + displacement into any Mesh*Material.
 *  `extra` lets the leaf material's height term be normalised by total height. */
function patchMaterial(mat, extra = '') {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, windUniforms);
    shader.vertexShader = 'uniform float uTime, uWindStrength, uWindDir, uGustFreq;\n' + extra + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + WIND_CHUNK);
    shader.vertexShader = shader.vertexShader.replace(
      '#include <defaultnormal_vertex>',
      '#include <defaultnormal_vertex>\n objectNormal = normalize(objectNormal + vec3(0.30 * uWindStrength, 0.0, 0.25 * uWindStrength));'
    );
    mat.userData.shader = shader;
  };
  // ensure the program (and uniforms) is compiled eagerly with unique cache key
  mat.customProgramCacheKey = () => extra + '|wind';
}

// The wind code normalises height by 11 (tree units); leaves need their own
// full-height normalisation so flutter amplitude doesn't collapse at the top.
const LEAF_HEIGHT = 'float h = clamp(position.y / 11.0, 0.0, 1.0);';
const LEAF_HEIGHT_OVERRIDE =
  '#ifdef USE_INSTANCING\n' +
  '  float h = clamp((modelMatrix * instanceMatrix * vec4(0.0,0.0,0.0,1.0)).y / 11.0, 0.0, 1.0);\n' +
  '#else\n' +
  '  float h = clamp((modelMatrix * vec4(0.0,0.0,0.0,1.0)).y / 11.0, 0.0, 1.0);\n' +
  '#endif\n';
const leafWindChunk = WIND_CHUNK.replace(LEAF_HEIGHT, LEAF_HEIGHT_OVERRIDE);

// ---- branch (bark) material --------------------------------------------
const barkMat = new THREE.MeshStandardMaterial({
  map: bark.color,
  normalMap: bark.normal,
  normalScale: new THREE.Vector2(0.9, 0.9),
  roughness: 0.95,
  metalness: 0,
  color: 0xc9b9a4
});
patchMaterial(barkMat, '');
// use the height-aware wind chunk for the bark too (11 units is the trunk-height ref)
barkMat.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, windUniforms);
  shader.vertexShader = 'uniform float uTime, uWindStrength, uWindDir, uGustFreq;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + WIND_CHUNK);
  shader.vertexShader = shader.vertexShader.replace(
    '#include <defaultnormal_vertex>',
    '#include <defaultnormal_vertex>\n objectNormal = normalize(objectNormal + vec3(0.30 * uWindStrength, 0.0, 0.25 * uWindStrength));'
  );
  barkMat.userData.shader = shader;
};
barkMat.customProgramCacheKey = () => 'bark|wind';

// depth materials (same wind code -> shadows animate)
const barkDepthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: bark.color, alphaTest: 0.5 });
const leafDepthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: leafTex, alphaTest: 0.5 });
patchMaterial(barkDepthMat, '');
patchMaterial(leafDepthMat, leafWindChunk.replace(WIND_CHUNK, '')); // uniform decl already added by patchMaterial

// ---- leaf material -------------------------------------------------------
const leafMat = new THREE.MeshStandardMaterial({
  map: leafTex,
  alphaMap: leafTex,
  alphaTest: 0.45,
  side: THREE.DoubleSide,
  roughness: 0.85,
  metalness: 0,
  color: 0xffffff
});
patchMaterial(leafMat, leafWindChunk.replace(WIND_CHUNK, ''));

// ---- generate ------------------------------------------------------------
let branchMesh = null;
let leafMesh = null;
let treeGroup = new THREE.Group();
scene.add(treeGroup);

function generateTree(p) {
  const rng = mulberry32(p.seed >>> 0);
  const branchGeos = [];
  const terminals = [];
  let branchCount = 0;
  const up = new THREE.Vector3(0, 1, 0);

  // walk one branch: position, direction, length, radius, depth
  function grow(pos, dir, len, rad, depth, isTrunk) {
    if (depth > p.depth || rad < 0.004 || len < 0.03) return;

    const end = pos.clone().addScaledVector(dir, len);
    // tapered cylinder between pos and end
    const seg = new THREE.CylinderGeometry(rad * p.radiusDecay, rad, len, depth <= 2 ? 7 : 5, 1, !isTrunk);
    seg.translate(0, len / 2, 0); // base at origin
    const q = new THREE.Quaternion().setFromUnitVectors(up, dir.clone().normalize());
    const m = new THREE.Matrix4().compose(pos, q, new THREE.Vector3(1, 1, 1));
    seg.applyMatrix4(m);
    branchGeos.push(seg);
    branchCount++;

    if (depth === p.depth) { terminals.push({ pos: end.clone(), dir: dir.clone() }); return; }

    // children fan around the parent direction
    const n = depth === 0 ? 3 : (rng() < 0.25 ? 3 : 2);
    for (let i = 0; i < n; i++) {
      // spread children evenly in azimuth, plus jitter
      const az = (i / n) * Math.PI * 2 + rng() * 0.9 + depth * 1.1;
      const split = THREE.MathUtils.degToRad(p.branchAngle) * (0.65 + rng() * 0.7);
      // build a child direction from parent dir, rotated by `split` toward azimuth
      const parent = dir.clone().normalize();
      let side = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
      side.addScaledVector(parent, -side.dot(parent));
      if (side.lengthSq() < 1e-6) side.set(1, 0, 0).addScaledVector(parent, -parent.x);
      side.normalize();
      const childDir = parent.clone()
        .multiplyScalar(Math.cos(split))
        .addScaledVector(side, Math.sin(split));
      childDir.y -= p.gravityDroop * (0.5 + rng() * 0.9); // gravity droop
      childDir.normalize();

      const childLen = len * p.lengthDecay * (0.75 + rng() * 0.45);
      const childRad = rad * p.radiusDecay * (0.85 + rng() * 0.25);
      grow(end, childDir, childLen, childRad, depth + 1, false);
    }
  }

  const trunkDir = new THREE.Vector3((rng() - 0.5) * 0.08, 1, (rng() - 0.5) * 0.08).normalize();
  grow(new THREE.Vector3(0, 0, 0), trunkDir, p.trunkHeight, p.trunkRadius, 0, true);

  const merged = mergeGeometries(branchGeos, false);
  branchGeos.forEach((g) => g.dispose());

  // ---- leaves ------------------------------------------------------------
  const leafCount = p.leafCount;
  const quad = new THREE.PlaneGeometry(1, 1);
  const colors = makeLeafColors(leafCount, p.autumn, rng);

  const lm = new THREE.InstancedMesh(quad, leafMat, leafCount);
  lm.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const dummy = new THREE.Object3D();

  for (let i = 0; i < leafCount; i++) {
    const t = terminals[(rng() * terminals.length) | 0] || { pos: new THREE.Vector3(0, p.trunkHeight, 0), dir: up };
    // scatter around the terminal tip within a small cluster radius
    const cluster = 0.15 + rng() * 0.55;
    dummy.position.copy(t.pos).add(new THREE.Vector3(
      (rng() - 0.5) * cluster * 2,
      (rng() - 0.5) * cluster * 1.6,
      (rng() - 0.5) * cluster * 2
    ));
    // orient: random tilt biased toward the terminal direction, then random spin
    const q = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0, 0, 1),
      t.dir.clone().add(new THREE.Vector3(rng() - 0.5, rng() - 0.5, rng() - 0.5)).normalize()
    );
    q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), rng() * Math.PI * 2));
    dummy.quaternion.copy(q);
    const s = 0.22 + rng() * 0.26;
    dummy.scale.set(s * (0.8 + rng() * 0.5), s, s);
    dummy.updateMatrix();
    lm.setMatrixAt(i, dummy.matrix);
    lm.setColorAt(i, colors[i]);
  }
  quad.dispose();
  lm.instanceMatrix.needsUpdate = true;
  if (lm.instanceColor) lm.instanceColor.needsUpdate = true;
  lm.castShadow = true;
  lm.receiveShadow = true;
  lm.frustumCulled = false;
  lm.customDepthMaterial = leafDepthMat;

  merged.computeBoundingSphere();
  branchMesh = new THREE.Mesh(merged, barkMat);
  branchMesh.castShadow = true;
  branchMesh.receiveShadow = true;
  branchMesh.customDepthMaterial = barkDepthMat;

  treeGroup.clear();
  treeGroup.add(branchMesh, lm);
  leafMesh = lm;

  return { branchCount, leafCount, tri: merged.attributes.position.count / 3 + leafCount * 2 };
}

function makeLeafColors(count, autumn, rng) {
  const arr = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    if (autumn) {
      // gold / orange / red-brown spread
      const v = rng();
      if (v < 0.4) c.setHSL(0.10 + rng() * 0.03, 0.85, 0.45 + rng() * 0.15);        // gold
      else if (v < 0.75) c.setHSL(0.05 + rng() * 0.04, 0.9, 0.42 + rng() * 0.14);    // orange
      else c.setHSL(0.02 + rng() * 0.02, 0.8, 0.32 + rng() * 0.12);                  // rust red
    } else {
      // green -> yellow-green
      c.setHSL(0.22 + rng() * 0.14, 0.5 + rng() * 0.3, 0.32 + rng() * 0.26);
    }
    arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
  }
  return arr;
}

function disposeTree() {
  if (branchMesh) { branchMesh.geometry.dispose(); branchMesh = null; }
  if (leafMesh) { leafMesh.dispose(); leafMesh = null; }
}

/* ============================================================================
   SECTION 4 — UI: bind inputs, rebuild, dispose
   ========================================================================== */

const state = {
  seed: 7, depth: 5, trunkHeight: 4, trunkRadius: 0.28,
  branchAngle: 36, lengthDecay: 0.74, radiusDecay: 0.70, gravityDroop: 0.18,
  leafCount: 9000, autumn: false,
  windStrength: 1, windDir: 45, gustFreq: 0.5,
  sunElev: 42, sunAzim: 135, shadows: true
};

const $ = (id) => document.getElementById(id);

const sliders = [
  ['depth', 'depthV', (v) => `${v}`],
  ['trunkH', 'trunkHV', (v) => (+v).toFixed(1)],
  ['trunkR', 'trunkRV', (v) => (+v).toFixed(2)],
  ['angle', 'angleV', (v) => `${v}°`],
  ['lenDecay', 'lenDecayV', (v) => (+v).toFixed(2)],
  ['radDecay', 'radDecayV', (v) => (+v).toFixed(2)],
  ['droop', 'droopV', (v) => (+v).toFixed(2)],
  ['leafCount', 'leafCountV', (v) => `${v}`],
  ['wind', 'windV', (v) => (+v).toFixed(2)],
  ['windDir', 'windDirV', (v) => `${v}°`],
  ['gust', 'gustV', (v) => (+v).toFixed(2)],
  ['sunElev', 'sunElevV', (v) => `${v}°`],
  ['sunAzim', 'sunAzimV', (v) => `${v}°`]
];

function rebuild() {
  disposeTree();
  const stats = generateTree(state);
  $('branches').textContent = stats.branchCount;
  $('leaves').textContent = stats.leafCount;
  $('triangles').textContent = `${Math.round(stats.tri).toLocaleString()} tris`;
}

sliders.forEach(([id, vid, fmt]) => {
  const el = $(id);
  el.addEventListener('input', () => {
    $(vid).textContent = fmt(el.value);
    const v = parseFloat(el.value);
    if (id === 'depth' || id === 'leafCount') state[id] = Math.round(v);
    else state[id] = v;

    if (id === 'depth' || id === 'leafCount') rebuild();
    else if (id === 'sunElev' || id === 'sunAzim') updateSun();
    else if (id === 'wind' || id === 'windDir' || id === 'gust') updateWindUniforms();
  });
});

$('seed').addEventListener('input', () => {
  state.seed = parseInt($('seed').value, 10) || 0;
  rebuild();
});
$('regen').addEventListener('click', () => {
  const s = Math.floor(Math.random() * 1000000);
  state.seed = s; $('seed').value = s; rebuild();
});
$('autumn').addEventListener('change', (e) => { state.autumn = e.target.checked; rebuild(); });
$('shadows').addEventListener('change', (e) => {
  state.shadows = e.target.checked;
  renderer.shadowMap.enabled = state.shadows;
  sun.castShadow = state.shadows;
  // force material recompile so shadow toggling takes effect
  barkMat.needsUpdate = true; leafMat.needsUpdate = true;
});

function updateWindUniforms() {
  windUniforms.uWindStrength.value = state.windStrength;
  windUniforms.uWindDir.value = THREE.MathUtils.degToRad(state.windDir);
  windUniforms.uGustFreq.value = state.gustFreq;
}
function updateSky() {
  const el = THREE.MathUtils.degToRad(state.sunElev);
  skyMat.uniforms.sunDir.value.set(
    Math.cos(el) * Math.cos(THREE.MathUtils.degToRad(state.sunAzim)),
    Math.sin(el),
    Math.cos(el) * Math.sin(THREE.MathUtils.degToRad(state.sunAzim))
  );
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================================
   SECTION 5 — RENDER LOOP + FPS counter
   ========================================================================== */

updateSun(); updateSky(); updateWindUniforms(); rebuild();

const clock = new THREE.Clock();
let frames = 0, fpsTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  windUniforms.uTime.value += dt;

  controls.update();
  renderer.render(scene, camera);

  frames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    $('fps').textContent = `${Math.round(frames / fpsTime)} FPS`;
    frames = 0; fpsTime = 0;
  }
}
animate();
</script>
</body>
</html>
